  /* ---------- Lista de control para imprimir (archivo HTML independiente) ---------- */
  function buildPrintHtml(list, scopeText, when) {
    const esc = (s) => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    const byEs = (a, b) => a.localeCompare(b, 'es');
    const cap = (s) => s.charAt(0).toUpperCase() + s.slice(1);
    const t = totalsOf(list);
    const dayData = t.byDay.map((b) => {
      const ps = list.filter((p) => p.days[b.key]).sort((x, y) => byEs(x.area || '', y.area || '') || byEs(x.name, y.name));
      const areas = new Map();
      ps.forEach((p) => {
        const a = p.area || 'Sin área';
        const o = areas.get(a) || { n: 0, comida: 0, cena: 0, snack: 0 };
        o.n += 1;
        MEALS.forEach((m) => { o[m.key] += qtyOf(p.days[b.key], m); });
        areas.set(a, o);
      });
      return { b, ps, areas: Array.from(areas.keys()).sort(byEs).map((a) => [a, areas.get(a)]) };
    });
    const th = (s, c) => '<th' + (c ? ' class="' + c + '"' : '') + '>' + s + '</th>';
    const summary = '<table><thead><tr>' + th('Fecha') + th('Personas', 'n') + th('Comidas', 'n') + th('Cenas', 'n') + th('Snacks', 'n') + th('Total', 'n') + '</tr></thead><tbody>' +
      dayData.map((d) => '<tr><td>' + esc(cap(labelFull(d.b.key))) + '</td><td class="n">' + d.ps.length + '</td><td class="n">' + d.b.comida + '</td><td class="n">' + d.b.cena + '</td><td class="n">' + d.b.snack + '</td><td class="n"><strong>' + d.b.total + '</strong></td></tr>').join('') +
      '</tbody></table>';
    const days = dayData.map((d, idx) => {
      const areaRows = d.areas.map((x) => '<tr><td>' + esc(x[0]) + '</td><td class="n">' + x[1].n + '</td><td class="n">' + x[1].comida + '</td><td class="n">' + x[1].cena + '</td><td class="n">' + x[1].snack + '</td></tr>').join('');
      const rows = d.ps.map((p, i) => '<tr><td class="n">' + (i + 1) + '</td><td>' + esc(p.name) + '</td><td>' + esc(p.area || 'Sin área') + '</td>' +
        MEALS.map((m) => '<td class="c">' + '●'.repeat(qtyOf(p.days[d.b.key], m)) + '</td>').join('') + '<td class="box"></td></tr>').join('');
      return '<section class="day' + (idx === 0 ? ' first' : '') + '"><h2>' + esc(cap(labelFull(d.b.key))) + '</h2><p class="sub">' + d.ps.length + ' ' + plural(d.ps.length, 'persona', 'personas') + ' con comida · ' + d.b.total + ' ' + plural(d.b.total, 'ración', 'raciones') + '</p>' +
        '<h3>Personas por área</h3><table class="small"><thead><tr>' + th('Área') + th('Personas', 'n') + th('Comidas', 'n') + th('Cenas', 'n') + th('Snacks', 'n') + '</tr></thead><tbody>' + areaRows + '</tbody></table>' +
        '<h3>Lista de control</h3><table><thead><tr>' + th('N.º', 'n') + th('Nombre') + th('Área') + th('Comida', 'c') + th('Cena', 'c') + th('Snack', 'c') + th('Entregado', 'c') + '</tr></thead><tbody>' + rows + '</tbody></table></section>';
    }).join('');
    const css = '*{box-sizing:border-box}body{font-family:Arial,Helvetica,sans-serif;color:#17171C;margin:0;padding:24px;font-size:13px}h1{font-size:22px;margin:0 0 4px}h2{font-size:18px;margin:0 0 2px}h3{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:#6B6B75;margin:16px 0 6px}.sub,.meta{color:#6B6B75;margin:0 0 6px}table{width:100%;border-collapse:collapse}th,td{border:1px solid #BDBDC4;padding:5px 8px;text-align:left}th{background:#F2F2F2}.n{text-align:right;width:1%;white-space:nowrap}.c{text-align:center;width:1%;white-space:nowrap}.box{width:90px}.small{max-width:480px}.day{margin-top:28px;break-before:page;page-break-before:always}.day.first{break-before:auto;page-break-before:auto}tr{break-inside:avoid}.bar{display:flex;gap:12px;align-items:center;margin-bottom:16px}button{font:inherit;font-weight:700;background:#CC1257;color:#fff;border:0;border-radius:8px;padding:10px 18px;cursor:pointer}@page{margin:12mm}@media print{.noprint{display:none}body{padding:0}}';
    return '<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lista de control de alimentos</title><style>' + css + '</style></head><body>' +
      '<div class="bar noprint"><button type="button" onclick="window.print()">Imprimir</button><span class="meta">También puedes usar Ctrl + P (o Cmd + P).</span></div>' +
      '<h1>Lista de control de alimentos</h1><p class="meta">Yoshi Cash · ' + esc(scopeText) + '</p><p class="meta">Generada: ' + esc(when) + '</p>' +
      '<p><strong>' + t.people + ' ' + plural(t.people, 'persona', 'personas') + '</strong> · ' + t.byDay.length + ' ' + plural(t.byDay.length, 'día', 'días') + ' · <strong>' + t.raciones + ' ' + plural(t.raciones, 'ración', 'raciones') + '</strong></p>' +
      '<h3>Resumen por día</h3>' + summary + days + '</body></html>';
  }

  /* ---------- Archivo de tokens (Excel con la plantilla del cliente, una hoja por tipo) ---------- */
  const TOKENS_TITLE = 'Plantilla de Importación de Códigos de Tokens';
  const xmlEsc = (s) => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  function tokensFiles(r) {
    const sheets = MEALS.map((m) => ({
      name: m.plural,
      rows: r.people.map((p) => ({ name: p.name, n: personTotals(p.days)[m.key] })).filter((x) => x.n > 0)
    })).filter((s) => s.rows.length > 0);
    const NS = 'http://schemas.openxmlformats.org/spreadsheetml/2006/main';
    const RN = 'http://schemas.openxmlformats.org/officeDocument/2006/relationships';
    const inl = (ref, s, text) => '<c r="' + ref + '" s="' + s + '" t="inlineStr"><is><t xml:space="preserve">' + xmlEsc(text) + '</t></is></c>';
    const files = {};
    files['[Content_Types].xml'] = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>' +
      sheets.map((s, i) => '<Override PartName="/xl/worksheets/sheet' + (i + 1) + '.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>').join('') + '</Types>';
    files['_rels/.rels'] = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>';
    files['xl/workbook.xml'] = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="' + NS + '" xmlns:r="' + RN + '"><sheets>' +
      sheets.map((s, i) => '<sheet name="' + xmlEsc(s.name) + '" sheetId="' + (i + 1) + '" r:id="rId' + (i + 2) + '"/>').join('') + '</sheets></workbook>';
    files['xl/_rels/workbook.xml.rels'] = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/>' +
      sheets.map((s, i) => '<Relationship Id="rId' + (i + 2) + '" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet' + (i + 1) + '.xml"/>').join('') + '</Relationships>';
    const al = '<alignment horizontal="left" vertical="center"/>';
    files['xl/styles.xml'] = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><styleSheet xmlns="' + NS + '"><fonts count="4"><font><sz val="11"/><color rgb="FF000000"/><name val="Calibri"/></font><font><b/><sz val="18"/><color rgb="FF000000"/><name val="Calibri"/></font><font><b/><sz val="12"/><color rgb="FF000000"/><name val="Calibri"/></font><font><sz val="12"/><color rgb="FF000000"/><name val="Calibri"/></font></fonts><fills count="3"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill><fill><patternFill patternType="solid"><fgColor rgb="FFF2F2F2"/><bgColor indexed="64"/></patternFill></fill></fills><borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="4"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/><xf numFmtId="0" fontId="1" fillId="0" borderId="0" xfId="0" applyFont="1" applyAlignment="1">' + al + '</xf><xf numFmtId="0" fontId="2" fillId="2" borderId="0" xfId="0" applyFont="1" applyFill="1" applyAlignment="1">' + al + '</xf><xf numFmtId="0" fontId="3" fillId="0" borderId="0" xfId="0" applyFont="1" applyAlignment="1">' + al + '</xf></cellXfs><cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>';
    sheets.forEach((s, i) => {
      const last = 3 + s.rows.length;
      let rows = '<row r="1">' + inl('A1', 1, TOKENS_TITLE) + '<c r="B1" s="1"/><c r="C1" s="1"/><c r="D1" s="1"/></row>';
      rows += '<row r="3">' + inl('A3', 2, 'Código') + inl('B3', 2, 'Comentario') + inl('C3', 2, 'Tipo de Token') + inl('D3', 2, 'Total Asignado') + '</row>';
      s.rows.forEach((x, j) => {
        const n = 4 + j;
        rows += '<row r="' + n + '"><c r="A' + n + '" s="3"/>' + inl('B' + n, 3, x.name) + inl('C' + n, 3, s.name) + '<c r="D' + n + '" s="3"><v>' + x.n + '</v></c></row>';
      });
      files['xl/worksheets/sheet' + (i + 1) + '.xml'] = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="' + NS + '"><dimension ref="A1:D' + last + '"/><cols><col min="1" max="1" width="25" customWidth="1"/><col min="2" max="2" width="42" customWidth="1"/><col min="3" max="4" width="20" customWidth="1"/></cols><sheetData>' + rows + '</sheetData><mergeCells count="1"><mergeCell ref="A1:D1"/></mergeCells></worksheet>';
    });
    return files;
  }
  async function tokensBuffer(r) {
    const zip = new window.JSZip();
    const files = tokensFiles(r);
    Object.keys(files).forEach((k) => zip.file(k, files[k]));
    return zip.generateAsync({ type: 'arraybuffer', compression: 'DEFLATE' });
  }

  function Ticket({ r, dl, onBack }) {
    const [note, setNote] = useState(null);
    const [manual, setManual] = useState(null);
    const taRef = useRef(null);
    useEffect(() => { if (manual && taRef.current) { taRef.current.focus(); taRef.current.select(); } }, [manual]);

    async function saveFile(kind) {
      try {
        let data;
        let filename;
        if (kind === 'tokens') {
          if (!window.JSZip) { setNote({ err: true, msg: 'No se pudo cargar el generador de Excel. Revisa tu conexión y recarga la página.' }); return; }
          data = await tokensBuffer(r);
          filename = 'Tokens-' + r.folio + '.xlsx';
        } else {
          data = kind === 'csv' ? buildCsv(r) : buildTxt(r);
          filename = 'Comprobante-' + r.folio + (kind === 'csv' ? '.csv' : '.txt');
        }
        await dl.save({ filename, data });
        setNote({ ok: true, msg: kind === 'tokens' ? 'Archivo de tokens guardado. Tiene una hoja por tipo: Comidas, Cenas y Snacks.' : 'Archivo guardado. Envíanoslo como respaldo.' });
      } catch (e) {
        if (e && e.code === 'declined') setNote({ msg: 'Descarga cancelada.' });
        else setNote({ err: true, msg: 'No se pudo guardar el archivo. Usa «Copiar» o toma una captura del ticket.' });
      }
    }
    async function copy(kind) {
      const text = kind === 'csv' ? buildCsv(r).replace('﻿', '') : buildTxt(r);
      try {
        await navigator.clipboard.writeText(text);
        setManual(null);
        setNote({ ok: true, msg: kind === 'csv' ? 'CSV copiado. Pégalo en Excel u otra hoja de cálculo.' : 'Ticket copiado al portapapeles.' });
      } catch (e) {
        setManual(text);
        setNote({ err: true, msg: 'Tu navegador bloqueó el portapapeles. El texto quedó seleccionado abajo: cópialo con Ctrl/Cmd + C.' });
      }
    }

    const btn = 'focus-ring inline-flex items-center justify-center gap-2 rounded-lg px-4 py-3 text-base font-semibold ';
    const primary = btn + 'bg-accent text-accent-ink';
    const secondary = btn + 'border border-line bg-surface text-ink';
    const dayGrid = 'grid grid-cols-[minmax(0,1fr)_2.4rem_2.4rem_2.4rem_2.6rem] items-baseline gap-x-1';
    const Dash = () => html`<div className="my-3 border-t border-dashed border-ticket-mute"></div>`;
    const KV = ({ k, v }) => html`<div className="flex justify-between gap-3"><span className="text-ticket-mute shrink-0">${k}</span><span className="min-w-0 break-words text-right font-medium">${v}</span></div>`;
    const nd = r.totals.byDay.length;

  /* ---------- Usuarios de empleados (se guardan en este navegador) ---------- */
  const USERS_KEY = 'control-voluntarios:users:v1';
  function loadUsers() {
    try {
      const a = JSON.parse(localStorage.getItem(USERS_KEY) || '[]');
      return Array.isArray(a) ? a.filter((u) => u && u.key && u.salt && u.hash && u.name) : [];
    } catch (e) { return []; }
  }
  function saveUsers(a) { try { localStorage.setItem(USERS_KEY, JSON.stringify(a)); return true; } catch (e) { return false; } }
  const toHex = (buf) => Array.from(new Uint8Array(buf)).map((b) => b.toString(16).padStart(2, '0')).join('');
  const newSalt = () => toHex(crypto.getRandomValues(new Uint8Array(16)));
  async function pwHash(pw, saltHex) {
    const salt = new Uint8Array(saltHex.match(/../g).map((x) => parseInt(x, 16)));
    const key = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveBits']);
    return toHex(await crypto.subtle.deriveBits({ name: 'PBKDF2', salt, iterations: 100000, hash: 'SHA-256' }, key, 256));
  }

  function EmployeeAuth({ onBack, onLogin }) {
    const [users, setUsers] = useState(loadUsers);
    const [mode, setMode] = useState(() => (loadUsers().length ? 'login' : 'create'));
    const [name, setName] = useState('');
    const [pw, setPw] = useState('');
    const [pw2, setPw2] = useState('');
    const [show, setShow] = useState(false);
    const [err, setErr] = useState(null);
    const [busy, setBusy] = useState(false);
    const fails = useRef(0);
    const lockUntil = useRef(0);
    const nameRef = useRef(null);
    useEffect(() => { if (nameRef.current) nameRef.current.focus(); }, [mode]);

    const switchMode = (m) => { setMode(m); setErr(null); setPw(''); setPw2(''); };
    async function submit(e) {
      e.preventDefault();
      if (busy) return;
      setErr(null);
      const clean = collapse(name);
      const key = normalize(clean);
      if (!(window.crypto && crypto.subtle)) { setErr({ t: 'Este navegador no permite crear usuarios seguros', d: 'Abre la página en un navegador actualizado.' }); return; }
      if (mode === 'create') {
        if (clean.length < 3) { setErr({ t: 'Escribe tu nombre', d: 'Mínimo 3 letras.' }); return; }
        if (users.some((u) => u.key === key)) { setErr({ t: 'Ese usuario ya existe', d: 'Usa otro nombre o inicia sesión.' }); return; }
        if (pw.length < 6) { setErr({ t: 'La contraseña es muy corta', d: 'Usa al menos 6 caracteres.' }); return; }
        if (pw !== pw2) { setErr({ t: 'Las contraseñas no coinciden', d: 'Escríbela igual en los dos campos.' }); return; }
        setBusy(true);
        try {
          const salt = newSalt();
          const hash = await pwHash(pw, salt);
          const next = users.concat([{ id: uid(), name: clean, key, salt, hash, created: Date.now() }]);
          if (!saveUsers(next)) { setErr({ t: 'No se pudo guardar el usuario', d: 'Este navegador no permite guardar datos. Revisa si estás en una ventana privada.' }); setBusy(false); return; }
          setUsers(next);
          onLogin(clean);
        } catch (x) { setErr({ t: 'No se pudo crear el usuario', d: 'Inténtalo de nuevo.' }); setBusy(false); }
        return;
      }
      if (Date.now() < lockUntil.current) { setErr({ t: 'Demasiados intentos', d: 'Espera unos segundos antes de intentar de nuevo.' }); return; }
      if (!clean || !pw) { setErr({ t: 'Escribe tu usuario y tu contraseña' }); return; }
      setBusy(true);
      try {
        const u = users.find((x) => x.key === key);
        const hash = await pwHash(pw, u ? u.salt : newSalt());
        if (u && hash === u.hash) { onLogin(u.name); return; }
        fails.current += 1;
        if (fails.current >= 5) { fails.current = 0; lockUntil.current = Date.now() + 30000; }
        setErr({ t: 'Usuario o contraseña incorrectos', d: 'Revisa los datos e inténtalo de nuevo.' });
        setPw('');
      } catch (x) { setErr({ t: 'No se pudo iniciar sesión', d: 'Inténtalo de nuevo.' }); }
      setBusy(false);
    }

    const field = 'focus-ring w-full rounded-lg border-2 border-line bg-subtle px-4 py-3 text-base text-ink placeholder:text-mute focus:border-accent';
    const seg = (key, label) => html`<button type="button" aria-pressed=${mode === key} onClick=${() => switchMode(key)}
      className=${'focus-ring flex-1 px-3 py-2 text-sm font-semibold ' + (mode === key ? 'bg-accent-soft text-accent' : 'bg-surface text-mute hover:text-ink')}>${label}</button>`;
    const create = mode === 'create';

    return html`<main className="mx-auto flex min-h-[80vh] w-full max-w-md flex-col justify-center gap-6 py-8">
      <button type="button" onClick=${onBack} className="focus-ring inline-flex w-fit items-center gap-2 rounded-md py-2 text-sm font-medium text-mute hover:text-ink"><${Icon} d=${P.back} size=${18} /> Volver</button>

          <h1 className="font-display text-2xl font-bold tracking-tight">Empleado de Yoshi</h1>
          <p className="text-sm text-mute">${create ? 'Crea tu usuario para entrar.' : 'Entra con tu usuario y contraseña.'}</p>
        </div>
      </div>
      <form onSubmit=${submit} noValidate className="flex flex-col gap-4 rounded-2xl border border-line bg-surface p-5 sm:p-6">
        <div role="group" aria-label="Elige una opción" className="flex overflow-hidden rounded-lg border border-line">${seg('login', 'Iniciar sesión')}${seg('create', 'Crear usuario')}</div>
        <div className="flex flex-col gap-1.5">
          <label htmlFor="au-nombre" className="text-sm font-semibold">${create ? 'Tu nombre (será tu usuario)' : 'Usuario'}</label>
          <input id="au-nombre" ref=${nameRef} type="text" autoComplete="username" maxLength=${60} value=${name} onChange=${(e) => { setName(e.target.value); setErr(null); }} placeholder="Nombre y apellido" className=${field} />
        </div>
        <div className="flex flex-col gap-1.5">
          <label htmlFor="au-clave" className="text-sm font-semibold">Contraseña</label>
          <div className="relative">
            <input id="au-clave" type=${show ? 'text' : 'password'} autoComplete=${create ? 'new-password' : 'current-password'} maxLength=${100} value=${pw} onChange=${(e) => { setPw(e.target.value); setErr(null); }} className=${field + ' pr-24'} />
            <button type="button" onClick=${() => setShow((s) => !s)} aria-pressed=${show} className="focus-ring absolute inset-y-1 right-1 rounded-md px-3 text-sm font-medium text-mute hover:text-ink">${show ? 'Ocultar' : 'Mostrar'}</button>
          </div>
          ${create ? html`<p className="text-xs text-mute">Mínimo 6 caracteres.</p>` : null}
        </div>
        ${create ? html`<div className="flex flex-col gap-1.5">
          <label htmlFor="au-clave2" className="text-sm font-semibold">Repite la contraseña</label>
          <input id="au-clave2" type=${show ? 'text' : 'password'} autoComplete="new-password" maxLength=${100} value=${pw2} onChange=${(e) => { setPw2(e.target.value); setErr(null); }} className=${field} />
        </div>` : null}
        ${err ? html`<${Alert} title=${err.t}>${err.d}<//>` : null}
        <button type="submit" disabled=${busy} className=${'focus-ring inline-flex items-center justify-center gap-2 rounded-lg px-6 py-3.5 text-base font-semibold ' + (busy ? 'cursor-not-allowed bg-line text-mute' : 'bg-accent text-accent-ink')}>
          <${Icon} d=${create ? P.plus : P.check} size=${20} sw=${create ? 2.5 : 3} /> ${busy ? 'Un momento…' : create ? 'Crear usuario y entrar' : 'Entrar'}
        </button>
        <p className="text-xs text-mute">Los usuarios se guardan solo en este navegador y este dispositivo. Si abres la página en otro lado, tendrás que crear el usuario de nuevo.</p>
      </form>
    </main>`;
  }

      const folio = makeFolio(d);
      const iso = isoLocal(d);
      const canon = [folio, iso, responsable, evento].concat(snap.map((p, i) => [i + 1, p.name, p.area, sortedKeys(p.days).map((k) => k + ':' + p.days[k]).join(',')].join('|'))).join('\n');
      const hash = await sha256(canon);
      let tzName = '';
      try { tzName = Intl.DateTimeFormat().resolvedOptions().timeZone || ''; } catch (e) { tzName = ''; }
      const tt = totalsOf(snap);
      const ks = tt.byDay.map((b) => b.key);
      setReceipt({
        folio, iso, hash, responsable, evento, people: snap, totals: tt, example,
        rango: ks.length ? labelFull(ks[0]) + (ks.length > 1 ? ' al ' + labelFull(ks[ks.length - 1]) : '') : '',
        fechaLarga: fechaLarga(d),
        hora: pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds()) + ' hrs',
        tzName: tzName || 'Hora local', tzOff: tzOffset(d), declaracion: DECLARACION
      });
      setBusy(false);
      setShowModal(false);
      setView('ticket');
    }

    const guest = role === 'invitado';
    async function downloadList() {
      if (!viewPeople.length) { setPrintNote({ err: true, msg: 'No hay datos en esta selección para imprimir. Elige otro día en la fecha de arriba.' }); return; }
      if (!dl) { setPrintNote({ err: true, msg: 'La descarga no está disponible en esta vista.' }); return; }
      const d = new Date();
      const when = fechaLarga(d) + ', ' + pad(d.getHours()) + ':' + pad(d.getMinutes()) + ' hrs';
      try {
        await dl.save({ filename: 'Lista-control-' + keyOf(d) + '.html', data: buildPrintHtml(viewPeople, scope, when) });
        setPrintNote({ ok: true, msg: 'Lista guardada. Ábrela y presiona «Imprimir».' });
      } catch (e) {
        setPrintNote(e && e.code === 'declined' ? { msg: 'Descarga cancelada.' } : { err: true, msg: 'No se pudo guardar la lista.' });
      }
    }
    const logout = () => {
      setMenuOpen(false); setFilterOpen(false); setImportOpen(false); setShowModal(false); setEditingId(null);
      setView('edit');
      setRole(null);
      setUser('');
      setAuth(false);
      setPrintNote(null);
    };
    if (!role) {
      if (auth) return html`<${EmployeeAuth} onBack=${() => setAuth(false)} onLogin=${(n) => { setUser(n); setRole('empleado'); setAuth(false); }} />`;
      return html`<${Welcome} onEnter=${(id) => { if (id === 'empleado') setAuth(true); else setRole(id); }} />`;
    }

    return html`<div className="mx-auto flex w-full max-w-4xl flex-col gap-6">
      <div className="flex items-center justify-end gap-2 text-sm">
        <span className="inline-flex items-center gap-1.5 rounded-full bg-accent-soft px-3 py-1 font-semibold text-accent"><${Icon} d=${role === 'empleado' ? P.briefcase : P.user} size=${14} />${ROLES[role]}${user ? ' · ' + user : ''}</span>
        <button type="button" onClick=${logout} className="focus-ring rounded-md px-2 py-1 font-medium text-mute hover:text-ink">Cambiar acceso</button>
      </div>
      <header className="flex flex-col gap-4 sm:flex-row sm:items-end sm:justify-between">
        <div className="min-w-0">
          <div className="flex items-center gap-3"><img src=${LOGO} alt="" width=${159} height=${160} className="h-10 w-auto shrink-0" /><h1 className="font-display text-3xl font-bold tracking-tight">Control de Voluntarios</h1></div>
          <p className="mt-1.5 max-w-xl text-base text-mute">${guest ? 'Importa tu archivo y consulta cuántas personas tienen comida cada día y de qué área son.' : 'Registra a cada persona y marca los días y las comidas que le tocan. Al terminar, genera tu comprobante.'}</p>
          ${view === 'edit' ? html`<button type="button" onClick=${() => setFilterOpen(true)} aria-haspopup="dialog" title="Filtrar por día"
            className="focus-ring mt-4 inline-flex max-w-full items-center gap-2 rounded-lg bg-subtle px-3.5 py-2 text-sm tabular hover:bg-accent-soft hover:text-accent">
            <${Icon} d=${P.calendar} size=${16} cls="shrink-0" />
            <span className="min-w-0 truncate">${chipDate} - Asignación de alimentos</span>
            ${fKeys.length > 1 ? html`<span className="shrink-0 rounded-full bg-accent px-2 py-0.5 text-xs font-semibold text-accent-ink">${fKeys.length} días</span>` : null}
            <${Icon} d=${P.down} size=${16} cls="shrink-0" />
          </button>` : html`<p className="mt-4 inline-block rounded-lg bg-subtle px-3.5 py-2 text-sm tabular">${hoy} - Asignación de alimentos</p>`}
        </div>
        ${guest ? null : html`<${Steps} step=${step} />`}
      </header>

      ${view === 'ticket' && receipt
        ? html`<${Ticket} r=${receipt} dl=${dl} onBack=${() => setView('edit')} />`
        : html`
          ${guest ? html`<div className="flex justify-end"><button type="button" onClick=${() => setImportOpen(true)} className="focus-ring inline-flex items-center gap-2 rounded-lg border border-line bg-surface px-3.5 py-2 text-sm font-semibold hover:border-accent hover:text-accent"><${Icon} d=${P.upload} size=${16} /> Importar datos</button></div>` : null}
          ${importNote ? html`<p role="status" className="flex items-center gap-2 rounded-xl border border-line bg-ok-bg px-4 py-3 text-sm font-medium text-ok"><${Icon} d=${P.check} size=${18} sw=${3} cls="shrink-0" />${importNote}</p>` : null}
          <${Counters} t=${totals} scope=${scope} />
          ${guest ? null : html`<${AddForm} byNorm=${byNorm} areas=${areas} people=${people} days=${draftDays} setDays=${setDraftDays} onOpenMenu=${() => setMenuOpen(true)} onAdd=${addPerson} onDup=${flashRow} onImport=${() => setImportOpen(true)} defaultDays=${filterDays} onEditMatch=${(p) => setEditingId(p.id)} />`}
          <${PeopleTable} readOnly=${guest} people=${viewPeople} scope=${scope} total=${people.length} onShowAll=${() => applyFilter({})} flash=${flash} example=${example} onDelete=${removePerson} onClear=${clearAll} onExample=${loadExample} onEdit=${(p) => setEditingId(p.id)} />
          ${guest ? html`<div className="sticky bottom-3 z-10 flex flex-col gap-3 rounded-2xl border border-line bg-surface p-3 shadow-[0_-10px_28px_-14px_rgba(0,0,0,0.35)] sm:flex-row sm:items-center sm:justify-between sm:p-4">
            <div className="min-w-0 px-1">
              <p className="text-sm font-semibold">Lista para imprimir: ${scope}</p>
              <p role="status" aria-live="polite" className=${'text-sm ' + (printNote ? (printNote.err ? 'font-medium text-danger' : printNote.ok ? 'font-medium text-ok' : 'text-mute') : 'text-mute')}>${printNote ? printNote.msg : 'Incluye cuántas personas hay por día y por área, con espacio para marcar la entrega.'}</p>
            </div>
            <button type="button" onClick=${downloadList} className="focus-ring inline-flex w-full items-center justify-center gap-2 rounded-lg bg-accent px-6 py-4 text-base font-bold text-accent-ink sm:w-auto"><${Icon} d=${P.download} size=${22} /> Descargar lista para imprimir</button>
          </div>` : null}
          <div className=${(guest ? 'hidden ' : '') + 'sticky bottom-3 z-10 flex flex-col gap-3 rounded-2xl border border-line bg-surface p-3 shadow-[0_-10px_28px_-14px_rgba(0,0,0,0.35)] sm:flex-row sm:items-center sm:justify-between sm:p-4'}>
            <p className=${'px-1 text-sm tabular ' + (sinComida.length ? 'font-semibold text-danger' : 'text-mute')}>
              ${people.length === 0
                ? 'Agrega al menos una persona para poder generar el comprobante.'
                : sinComida.length > 0
                  ? sinComida.length + ' ' + plural(sinComida.length, 'persona no tiene', 'personas no tienen') + ' comidas asignadas. Edítalas o elimínalas para continuar.'
                  : html`<strong className="text-ink">${allTotals.people} ${plural(allTotals.people, 'persona', 'personas')}</strong> · ${nd} ${plural(nd, 'día', 'días')} · ${allTotals.raciones} raciones en total`}
            </p>
            <button type="button" disabled=${people.length === 0 || sinComida.length > 0} onClick=${() => setShowModal(true)}
              className=${'focus-ring inline-flex w-full items-center justify-center gap-2 rounded-lg px-6 py-4 text-base font-bold sm:w-auto ' + (people.length === 0 || sinComida.length > 0 ? 'cursor-not-allowed bg-line text-mute' : 'bg-accent text-accent-ink')}>
              <${Icon} d=${P.receipt} size=${22} /> Finalizar y Generar Comprobante
            </button>
          </div>`}

      ${menuOpen && view === 'edit' ? html`<${DayMenu} value=${draftDays} onApply=${setDraftDays} onClose=${() => setMenuOpen(false)} idp="dm" />` : null}
      ${filterOpen && view === 'edit' ? html`<${DayMenu} filter=${true} people=${people} dataDays=${dataDays} value=${filterDays} onApply=${applyFilter} onClose=${() => setFilterOpen(false)} idp="df" />` : null}
      ${importOpen && view === 'edit' ? html`<${ImportModal} initialStart=${fKeys[0]} byNorm=${byNorm} dl=${dl} hasExample=${example} onImport=${importPeople} onClose=${() => setImportOpen(false)} />` : null}
      ${showModal ? html`<${ConfirmModal} totals=${allTotals} busy=${busy} onCancel=${() => { if (!busy) setShowModal(false); }} onConfirm=${generate} />` : null}
      ${editing ? html`<${EditModal} key=${editing.id} p=${editing} people=${people.filter((x) => x.id !== editing.id)} byNorm=${byNorm} areas=${areas} onSave=${savePerson} onCancel=${() => setEditingId(null)} />` : null}
    </div>`;
  }

  ReactDOM.createRoot(document.getElementById('root')).render(html`<${App} />`);
})();

</script>

</body></html>
