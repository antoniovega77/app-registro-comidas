<style>
  /* Layout: una sola columna centrada. Contadores arriba, formulario, lista y barra fija para finalizar. */
  :root {
    --paper: #FFFFFF;
    --surface: #FFFFFF;
    --subtle: #F6F6F7;
    --ink: #17171C;
    --mute: #6B6B75;
    --line: #E6E6E9;
    --accent: #CC1257;
    --accent-ink: #FFFFFF;
    --accent-soft: #FDE8F1;
    --rosa: #E8458D;
    --rosa-claro: #F5A9CC;
    --danger: #D92D20;
    --danger-bg: #FEECEB;
    --ok: #137A4B;
    --ok-bg: #E2F4EA;
    --comida: #B45309;
    --comida-bg: #FEF3C7;
    --cena: #6D28D9;
    --cena-bg: #EDE9FE;
    --snack: #0F766E;
    --snack-bg: #CCFBF1;
    --ticket: #FFFFFF;
    --ticket-ink: #17171C;
    --ticket-mute: #6B6B75;
    color-scheme: light;
  }
  html { background: #FFFFFF; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    font-size: 16px;
    padding-block: 24px 32px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  h1, h2, h3 { text-wrap: balance; }
  .focus-ring:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .tabular { font-variant-numeric: tabular-nums; }
  @keyframes flash-row { 0%, 55% { background: var(--danger-bg); } 100% { background: transparent; } }
  .flash { animation: flash-row 2.6s ease-out; }
  .ticket-edge {
    height: 8px;
    background-image:
      linear-gradient(135deg, var(--ticket) 4px, transparent 0),
      linear-gradient(225deg, var(--ticket) 4px, transparent 0);
    background-size: 8px 8px;
    background-repeat: repeat-x;
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
  }
</style>

  const DECLARACION = 'Declaro que capturé y revisé esta lista y que es correcta. Las raciones se entregarán conforme a este acuse.';

  const uid = () => Math.random().toString(36).slice(2) + Date.now().toString(36);
  const pad = (n) => String(n).padStart(2, '0');
  const collapse = (s) => s.replace(/\s+/g, ' ').trim();
  const normalize = (s) => collapse(s).normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
  const plural = (n, one, many) => (n === 1 ? one : many);

  /* fechas: cada día se guarda como texto AAAA-MM-DD */
  function keyOf(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function parseKey(k) {
    const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(k || '');
    if (!m) return null;
    const d = new Date(+m[1], +m[2] - 1, +m[3]);
    return isNaN(d.getTime()) ? null : d;
  }
  function addDays(d, n) { return new Date(d.getFullYear(), d.getMonth(), d.getDate() + n); }
  function labelShort(k) { const d = parseKey(k); return d ? DIAS_C[d.getDay()] + ' ' + d.getDate() + ' ' + MESES_C[d.getMonth()] : k; }
  function labelFull(k) { const d = parseKey(k); return d ? labelShort(k) + ' ' + d.getFullYear() : k; }
  function runLabel(a, b) {
    if (a === b) return labelFull(a);
    const da = parseKey(a);
    const db = parseKey(b);
    return (da.getFullYear() === db.getFullYear() ? labelShort(a) : labelFull(a)) + ' al ' + labelFull(b);
  }
  function shortRange(a, b) {
    const da = parseKey(a);
    const db = parseKey(b);
    if (a === b) return da.getDate() + ' ' + MESES_C[da.getMonth()];
    if (da.getMonth() === db.getMonth() && da.getFullYear() === db.getFullYear()) return da.getDate() + '–' + db.getDate() + ' ' + MESES_C[da.getMonth()];
    return da.getDate() + ' ' + MESES_C[da.getMonth()] + ' – ' + db.getDate() + ' ' + MESES_C[db.getMonth()];
  }
  function monthCells(y, m) {
    const offset = (new Date(y, m, 1).getDay() + 6) % 7;
    const dim = new Date(y, m + 1, 0).getDate();
    const weeks = Math.ceil((offset + dim) / 7);
    return Array.from({ length: weeks * 7 }, (_, i) => {

      return { key: keyOf(d), day: d.getDate(), out: d.getMonth() !== m };
    });
  }

  /* días de una persona: { 'AAAA-MM-DD': comidas }, con comidas = 1 comida + 2 cena + 4 snack */
  function cleanDays(o) {
    const r = {};
    Object.keys(o || {}).forEach((k) => {
      let v = (parseInt(o[k], 10) || 0) & 63;
      MEALS.forEach((m) => { if (v & (m.bit << 3)) v |= m.bit; });
      if ((v & ALL) && parseKey(k)) r[k] = v;
    });
    return r;
  }
  const sortedKeys = (days) => Object.keys(days).filter((k) => days[k]).sort();
  function personTotals(days) {
    const t = { comida: 0, cena: 0, snack: 0, raciones: 0, dias: 0 };
    sortedKeys(days).forEach((k) => {
      MEALS.forEach((m) => { const q = qtyOf(days[k], m); if (q) { t[m.key] += q; t.raciones += q; } });
      t.dias += 1;
    });
    return t;
  }
  function totalsOf(list) {
    const map = {};
    const t = { people: list.length, comida: 0, cena: 0, snack: 0, raciones: 0, byDay: [] };
    list.forEach((p) => sortedKeys(p.days).forEach((k) => {
      const b = map[k] || (map[k] = { key: k, comida: 0, cena: 0, snack: 0, total: 0 });
      MEALS.forEach((m) => {
        const q = qtyOf(p.days[k], m);
        if (q) { t[m.key] += q; t.raciones += q; b[m.key] += q; b.total += q; }
      });
    }));
    t.byDay = Object.keys(map).sort().map((k) => map[k]);
    return t;
  }
  function dateRuns(keys) {
    const runs = [];
    keys.forEach((k) => {
      const last = runs[runs.length - 1];
      if (last && keyOf(addDays(parseKey(last.to), 1)) === k) last.to = k;
      else runs.push({ from: k, to: k });
    });
    return runs;
  }
  function diasTexto(days) {
    const keys = sortedKeys(days);
    if (!keys.length) return 'Sin días';
    return dateRuns(keys).map((r) => shortRange(r.from, r.to)).join(', ');
  }
  function runsOf(days) {
    const runs = [];
    sortedKeys(days).forEach((k) => {
      const last = runs[runs.length - 1];
      if (last && last.mask === days[k] && keyOf(addDays(parseKey(last.to), 1)) === k) { last.to = k; last.count += 1; }
      else runs.push({ from: k, to: k, mask: days[k], count: 1 });
    });
    return runs;
  }
  const mealsText = (mask) => MEALS.filter((m) => mask & m.bit).map((m) => m.label + (qtyOf(mask, m) > 1 ? ' ×2' : '')).join(' + ');
  const mealsShort = (mask) => MEALS.filter((m) => mask & m.bit).map((m) => m.short + (qtyOf(mask, m) > 1 ? '×2' : '')).join(' ');
  function stripKeys(days) {
    const keys = sortedKeys(days);
    if (!keys.length) return [];
    const a = parseKey(keys[0]);
    const b = parseKey(keys[keys.length - 1]);
    const span = Math.round((b - a) / 86400000) + 1;
    return span > 62 ? keys : Array.from({ length: span }, (_, i) => keyOf(addDays(a, i)));
  }

  /* hora y folio */
  function tzOffset(d) {
    const off = -d.getTimezoneOffset();
    const sign = off >= 0 ? '+' : '-';
    const a = Math.abs(off);
    return sign + pad(Math.floor(a / 60)) + ':' + pad(a % 60);
  }
  function isoLocal(d) {
    return keyOf(d) + 'T' + pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds()) + tzOffset(d);
  }
  function makeFolio(d) {
    return 'RC-' + d.getFullYear() + pad(d.getMonth() + 1) + pad(d.getDate()) + '-' + pad(d.getHours()) + pad(d.getMinutes()) + pad(d.getSeconds()) + '-' + Math.random().toString(36).slice(2, 6).toUpperCase();
  }
  function fechaLarga(d) {
    const s = DIAS[d.getDay()] + ' ' + d.getDate() + ' de ' + MESES[d.getMonth()] + ' de ' + d.getFullYear();
    return s.charAt(0).toUpperCase() + s.slice(1);
  }
  async function sha256(text) {
    try {
      const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
      return Array.from(new Uint8Array(buf)).map((b) => b.toString(16).padStart(2, '0')).join('');
    } catch (e) { return null; }
  }

  /* ---------- Archivos del comprobante ---------- */
  function buildCsv(r) {
    const q = (v) => '"' + String(v).replace(/"/g, '""') + '"';
    const meta = [r.folio, r.iso, r.tzName, r.evento, r.responsable];
    const dates = r.totals.byDay.map((b) => b.key);
    const head = ['Folio', 'Fecha_hora_generacion', 'Zona_horaria', 'Evento_referencia', 'Responsable', 'No', 'Nombre', 'Area'];
    dates.forEach((k) => MEALS.forEach((m) => head.push(k + '_' + m.label)));
    head.push('Total_Dias', 'Total_Comidas', 'Total_Cenas', 'Total_Snacks', 'Total_Raciones');
    const rows = [head];
    r.people.forEach((p, i) => {
      const t = personTotals(p.days);
      const row = meta.concat([i + 1, p.name, p.area || '']);
      dates.forEach((k) => MEALS.forEach((m) => row.push(qtyOf(p.days[k] || 0, m))));
      rows.push(row.concat([t.dias, t.comida, t.cena, t.snack, t.raciones]));
    });
    const tot = meta.concat(['TOTAL', r.totals.people + ' personas', '']);
    r.totals.byDay.forEach((b) => MEALS.forEach((m) => tot.push(b[m.key])));
    rows.push(tot.concat([dates.length, r.totals.comida, r.totals.cena, r.totals.snack, r.totals.raciones]));
    if (r.example) rows.push(['AVISO', 'DATOS DE EJEMPLO - SIN VALOR']);
    if (r.hash) rows.push(['SHA-256', r.hash]);
    return '﻿' + rows.map((x) => x.map(q).join(',')).join('\r\n');
  }
  function wrapText(text, w) {
    const lines = [];
    let cur = '';
    text.split(' ').forEach((word) => {
      if (!cur) cur = word;
      else if ((cur + ' ' + word).length <= w) cur += ' ' + word;
      else { lines.push(cur); cur = word; }
      while (cur.length > w) { lines.push(cur.slice(0, w)); cur = cur.slice(w); }
    });
    if (cur) lines.push(cur);
    return lines;
  }
  function buildTxt(r) {
    const W = 44;
    const hr = '-'.repeat(W);
    const dh = '='.repeat(W);
    const ctr = (s) => ' '.repeat(Math.max(0, Math.floor((W - s.length) / 2))) + s;

    const o = [dh, ctr('ACUSE DE RECIBO'), ctr('ASIGNACIÓN DE ALIMENTOS'), dh];

    o.push('Folio : ' + r.folio, 'Fecha : ' + r.fechaLarga, 'Hora  : ' + r.hora, 'Zona  : ' + r.tzName + ' (UTC' + r.tzOff + ')');
    if (r.evento) wrapText('Evento: ' + r.evento, W).forEach((l) => o.push(l));
    wrapText('Responsable: ' + r.responsable, W).forEach((l) => o.push(l));
    o.push('Días con comida: ' + r.totals.byDay.length);
    if (r.rango) wrapText('Fechas: ' + r.rango, W).forEach((l) => o.push(l));
    o.push(hr, 'TOTALES POR DÍA', hr, 'Fecha'.padEnd(W - 16) + ' COM CEN SNK TOT');
    r.totals.byDay.forEach((b) => {
      o.push(labelShort(b.key).padEnd(W - 16) + num(b.comida) + num(b.cena) + num(b.snack) + num(b.total));
    });
    o.push(hr,

      'Cenas          : ' + r.totals.cena,
      'Snacks         : ' + r.totals.snack,
      'TOTAL RACIONES : ' + r.totals.raciones, hr,
      'DETALLE POR PERSONA', 'COM = Comida, CEN = Cena, SNK = Snack', hr);
    r.people.forEach((p, i) => {
      wrapText((i + 1) + '. ' + p.name, W).forEach((l) => o.push(l));
      if (p.area) wrapText('Área: ' + p.area, W - 3).forEach((l) => o.push('   ' + l));
      runsOf(p.days).forEach((run) => {
        wrapText(runLabel(run.from, run.to) + ': ' + mealsShort(run.mask), W - 3).forEach((l) => o.push('   ' + l));
      });
      o.push('');
    });
    o.push(hr);
    wrapText(r.declaracion, W).forEach((l) => o.push(l));
    o.push('', '', '_'.repeat(W), ctr(r.responsable), ctr('Nombre y firma del responsable'));
    if (r.hash) { o.push(hr, 'Huella SHA-256:'); wrapText(r.hash, W).forEach((l) => o.push(l)); }
    o.push(dh);
    return o.join('\r\n');
  }

    const sel = 'focus-ring rounded-md border border-line bg-surface px-2 py-1.5 text-sm font-semibold text-ink';

    return html`<div className="fixed inset-0 z-[60] grid place-items-center bg-black/60" style=${overlayStyle()} onClick=${() => { if (!dirty) onClose(); }}>
      <div role="dialog" aria-modal="true" aria-labelledby=${idp + '-titulo'} onClick=${(e) => e.stopPropagation()}

        <div className="flex items-start justify-between gap-4 p-5 pb-3 sm:p-6 sm:pb-3">

            <h2 id=${idp + '-titulo'} className="flex items-center gap-2 font-display text-2xl font-bold">${fl ? 'Filtrar por día' : 'Días y comidas'} <${Icon} d=${P.calendar} size=${22} cls="text-accent" /></h2>

          </div>
          <button type="button" onClick=${onClose} aria-label="Cerrar sin aplicar" className="focus-ring grid h-9 w-9 shrink-0 place-items-center rounded-md text-mute hover:text-ink"><${Icon} d=${P.x} size=${20} /></button>
        </div>

        <div className="grid min-h-0 flex-1 gap-5 overflow-y-auto px-5 pb-4 sm:px-6 md:grid-cols-[minmax(0,17rem)_minmax(0,1fr)] md:gap-6">
          <div className="order-2 flex min-w-0 flex-col gap-3 md:order-1">
            <div className="flex items-center gap-3 rounded-xl border-2 border-accent bg-accent-soft px-4 py-3 text-accent">
              <${Icon} d=${P.calendar} size=${20} cls="shrink-0" />
              <div className="min-w-0">
                <p className="font-semibold">${fl ? (pt.dias ? pt.dias + ' ' + plural(pt.dias, 'día seleccionado', 'días seleccionados') : 'Todos los días') : pt.dias + ' ' + plural(pt.dias, 'día asignado', 'días asignados')}</p>
                <p className="text-xs">${fl ? dayStat(pt.dias ? keys : Object.keys(dataDays || {})) : pt.raciones + ' ' + plural(pt.raciones, 'ración', 'raciones')}</p>
              </div>
            </div>
            ${keys.length === 0
              ? html`<p className="rounded-xl border border-dashed border-line px-4 py-6 text-center text-sm text-mute">${fl ? 'Sin filtro: se muestran todos los días. Toca un día para ver solo ese día.' : 'Todavía no hay días. Toca los días en el calendario.'}</p>`
              : html`<ul className="flex max-h-[22rem] flex-col gap-2 overflow-y-auto md:max-h-[26rem]">
                  ${keys.map((k) => html`<li key=${k} className="rounded-xl border border-line px-3 py-2">
                    <div className="flex items-center justify-between gap-2">
                      <span className="text-sm font-semibold">${labelFull(k)}</span>
                      <button type="button" onClick=${() => removeDay(k)} aria-label=${'Quitar ' + labelFull(k)} className="focus-ring grid h-7 w-7 place-items-center rounded-md text-mute hover:text-danger"><${Icon} d=${P.x} size=${16} /></button>
                    </div>
                    ${fl ? html`<p className="mt-0.5 text-xs text-mute tabular">${dayStat([k])}</p>` : null}
                    <div className=${fl ? 'hidden' : 'mt-1.5 grid grid-cols-3 gap-1.5'}>
                      ${MEALS.map((m) => {
                        const on = !!(work[k] & m.bit);
                        return html`<button key=${m.key} type="button" aria-pressed=${on} onClick=${() => toggleMeal(k, m.bit)}
                          className=${'focus-ring h-8 rounded-md border-2 text-xs font-semibold ' + (on ? MEAL_STYLE[m.key].box : 'border-line bg-surface text-mute')}>${m.label}</button>`;
                      })}

          </div>

          <div className="order-1 flex min-w-0 flex-col gap-4 md:order-2 md:border-l md:border-line md:pl-6">
            <div className="grid grid-cols-2 gap-x-4 gap-y-1">
              ${presets.map(([id, label]) => html`<button key=${id} type="button" onClick=${() => preset(id)} className="focus-ring rounded-md px-2 py-1.5 text-left text-sm font-semibold hover:bg-subtle hover:text-accent">${label}</button>`)}
            </div>

            <div className="rounded-xl border border-line p-3 sm:p-4">

                  <select id=${idp + '-anio'} value=${view.y} onChange=${(e) => setView((v) => ({ ...v, y: +e.target.value }))} className=${sel}>${years.map((y) => html`<option key=${y} value=${y}>${y}</option>`)}</select>
                </div>
                <button type="button" onClick=${() => go(1)} aria-label="Mes siguiente" className=${arrow}><${Icon} d=${P.right} size=${16} sw=${2.5} /></button>
              </div>
              <div className="mt-3 grid grid-cols-7 text-center text-xs text-mute">${SEMANA.map((d) => html`<span key=${d} className="py-1">${d}</span>`)}</div>
              <div className="grid grid-cols-7 gap-y-1 text-center">
                ${cells.map((c) => {
                  const on = !!work[c.key];
                  const pending = rangeStart === c.key;
                  const dot = dataDays && dataDays[c.key] ? html`<span className=${'absolute bottom-[3px] h-1 w-1 rounded-full ' + (on ? 'bg-accent-ink' : 'bg-accent')}></span>` : null;
                  return html`<button key=${c.key} type="button" aria-pressed=${on} aria-label=${labelFull(c.key) + (on ? (fl ? ', seleccionado' : ', con comidas') : '')} onClick=${() => clickDay(c.key)}
                    className=${'focus-ring relative mx-auto grid h-9 w-9 place-items-center rounded-full text-sm tabular ' + (on ? 'bg-accent font-semibold text-accent-ink' : (pending ? 'bg-accent-soft font-semibold text-accent ring-2 ring-accent' : 'hover:bg-subtle')) + (c.out && !on ? ' opacity-50' : '') + (c.key === todayKey && !on && !pending ? ' ring-1 ring-accent' : '')}>${c.day}${dot}</button>`;
                })}

              ${hint || (mode === 'range' ? (rangeStart ? 'Inicio: ' + labelFull(rangeStart) + '. Toca el último día del rango.' : 'Toca el primer día del rango y después el último.') : 'Toca un día para marcarlo. Tócalo otra vez para quitarlo.')}
            </p>

            <div className=${fl ? 'hidden' : ''}>
              <p className="mb-2 text-sm font-semibold">Comidas al marcar un día</p>
              <div className="flex flex-wrap gap-2" role="group" aria-label="Comidas que se asignan al marcar un día">
                ${MEALS.map((m) => html`<${BrushChip} key=${m.key} meal=${m} on=${!!(tpl & m.bit)} onClick=${() => { setTpl((x) => x ^ m.bit); setHint(''); }} />`)}
              </div>
              <p className="mt-2 text-xs text-mute">Después puedes ajustar las comidas de cada día en la lista.</p>
            </div>
          </div>
        </div>

        <div className="flex flex-col-reverse gap-2 border-t border-line p-4 sm:flex-row sm:justify-end sm:px-6">
          <button type="button" onClick=${restore} className="focus-ring inline-flex items-center justify-center gap-2 rounded-lg border border-line px-5 py-3 text-base font-medium"><${Icon} d=${P.undo} size=${18} /> Restaurar</button>
          <button type="button" onClick=${apply} className="focus-ring inline-flex items-center justify-center gap-2 rounded-lg bg-accent px-6 py-3 text-base font-semibold text-accent-ink"><${Icon} d=${P.check} size=${18} sw=${3} /> Aplicar</button>
        </div>
      </div>
    </div>`;
  }

  /* ---------- Importar desde Excel ---------- */
  const HEADS = { nombre: 'name', nombrecompleto: 'name', beneficiario: 'name', area: 'area', comidas: 'comida', comida: 'comida', cenas: 'cena', cena: 'cena', snacks: 'snack', snack: 'snack' };
  const headKey = (v) => HEADS[normalize(String(v == null ? '' : v)).replace(/[^a-z]/g, '')];
  function parseCount(v) {
    if (v == null || String(v).trim() === '') return { n: 0 };
    const x = Number(String(v).trim().replace(',', '.'));
    if (!isFinite(x) || x < 0 || Math.floor(x) !== x || x > 366) return { err: true };
    return { n: x };
  }
  function parseSheetRows(rows, existing) {
    let col = null;
    let first = 0;
    for (let i = 0; i < Math.min(rows.length, 6) && !col; i++) {
      const m = {};
      (rows[i] || []).forEach((cell, j) => { const k = headKey(cell); if (k && m[k] === undefined) m[k] = j; });
      if (m.name !== undefined && Object.keys(m).length >= 2) { col = m; first = i + 1; }
    }
    if (!col) col = { name: 0, area: 1, comida: 2, cena: 3, snack: 4 };
    const seen = new Map();
    const items = [];
    for (let i = first; i < rows.length; i++) {
      const r = rows[i] || [];
      if (r.every((c) => String(c == null ? '' : c).trim() === '')) continue;
      const cell = (k) => (col[k] === undefined ? '' : r[col[k]]);
      const name = collapse(String(cell('name') == null ? '' : cell('name')));
      const area = collapse(String(cell('area') == null ? '' : cell('area')));
      const cs = { comida: parseCount(cell('comida')), cena: parseCount(cell('cena')), snack: parseCount(cell('snack')) };
      let error = null;
      if (!name) error = 'Falta el nombre';
      else if (cs.comida.err || cs.cena.err || cs.snack.err) error = 'Cantidad no válida (usa números enteros)';
      else if (!area) error = 'Falta el área';
      else if (cs.comida.n + cs.cena.n + cs.snack.n === 0) error = 'No tiene ninguna comida';
      else if (seen.has(normalize(name))) error = 'Repetido en la fila ' + seen.get(normalize(name));
      if (name && !seen.has(normalize(name))) seen.set(normalize(name), i + 1);
      items.push({ row: i + 1, name, area, comida: cs.comida.n || 0, cena: cs.cena.n || 0, snack: cs.snack.n || 0, error, update: !error && existing.has(normalize(name)) });
    }
    return items;
  }
  function daysFromCounts(startKey, c, e, s) {
    const start = parseKey(startKey);
    const days = {};
    [[c, 1], [e, 2], [s, 4]].forEach((p) => {
      for (let i = 0; i < p[0]; i++) { const k = keyOf(addDays(start, i)); days[k] = (days[k] || 0) | p[1]; }
    });
    return days;
  }
  function templateBuffer() {
    const X = window.XLSX;
    const ws = X.utils.aoa_to_sheet([
      ['Nombre', 'Área', 'Comidas', 'Cenas', 'Snacks'],
      ['Ejemplo Uno Apellido (borra esta fila)', 'Jugadores', 9, 9, 9],
      ['Ejemplo Dos Apellido (borra esta fila)', 'Árbitros', 6, 6, 0]
    ]);
    ws['!cols'] = [{ wch: 38 }, { wch: 18 }, { wch: 10 }, { wch: 10 }, { wch: 10 }];
    const wb = X.utils.book_new();
    X.utils.book_append_sheet(wb, ws, 'Voluntarios');
    return X.write(wb, { type: 'array', bookType: 'xlsx' });
  }

  /* Formato de requisición: una hoja por departamento, fechas en columnas con Comida / Cena (y Snack) por día */
  const GRID_TYPES = { comida: 'comida', comidas: 'comida', cena: 'cena', cenas: 'cena', snack: 'snack', snacks: 'snack' };
  const lab = (v) => normalize(String(v == null ? '' : v)).replace(/[^a-z]/g, '');
  const isSerial = (v) => typeof v === 'number' && v > 40000 && v < 80000;
  const serialKey = (n) => {
    const d = new Date(Date.UTC(1899, 11, 30) + Math.floor(n) * 86400000);
    return d.getUTCFullYear() + '-' + pad(d.getUTCMonth() + 1) + '-' + pad(d.getUTCDate());
  };
  function cellQty(v) {
    if (v == null || v === '') return { n: 0 };
    if (typeof v === 'number') return v === 0 ? { n: 0 } : (Number.isInteger(v) && v >= 1 && v <= 2) ? { n: v } : { bad: 'num' };
    const s = String(v).trim().toLowerCase();
    if (s === '' || s === '0') return { n: 0 };
    if (s === '1' || s === '2') return { n: +s };
    if (/^(x|✓|✔|si|sí|ok)$/.test(s)) return { n: 1, note: true };
    return { bad: 'text' };
  }
  function gridSheet(rows, sheet) {
    let hi = -1;
    let dateCols = [];
    for (let i = 0; i < Math.min(rows.length, 15) && hi < 0; i++) {
      const cols = [];
      (rows[i] || []).forEach((v, j) => { if (isSerial(v)) cols.push(j); });
      if (cols.length >= 2) { hi = i; dateCols = cols; }
    }
    if (hi < 0) return null;
    const head = rows[hi];
    const sub = rows[hi + 1] || [];
    let nameC = -1;
    let areaC = -1;
    head.forEach((v, j) => {
      if (j >= dateCols[0]) return;
      const l = lab(v);
      if (l === 'nombre' || l === 'nombrecompleto') { if (nameC < 0) nameC = j; else if (areaC < 0) areaC = j; }
      else if ((l === 'area' || l === 'departamento') && areaC < 0) areaC = j;
    });
    if (nameC < 0) nameC = 1;
    const groups = dateCols.map((j, gi) => {
      let end = gi + 1 < dateCols.length ? dateCols[gi + 1] : head.length;
      for (let c = j + 1; c < end; c++) { const v = head[c]; if (v !== '' && v != null && !isSerial(v)) { end = c; break; } }
      const cols = {};
      for (let c = j; c < end; c++) { const t = GRID_TYPES[lab(sub[c])]; if (t && cols[t] === undefined) cols[t] = c; }
      if (!Object.keys(cols).length) { cols.comida = j; if (j + 1 < end) cols.cena = j + 1; }
      return { key: serialKey(head[j]), cols };
    });
    const items = [];
    for (let i = hi + 2; i < rows.length; i++) {
      const r = rows[i] || [];
      const raw = r[nameC];
      const name = collapse(String(raw == null ? '' : raw));
      if (!name || /^total/i.test(name) || /^\d+$/.test(name) || /^total/i.test(String(r[0] == null ? '' : r[0]))) continue;
      const colArea = areaC >= 0 ? collapse(String(r[areaC] == null ? '' : r[areaC])) : '';
      const days = {};
      const warns = [];
      const xs = [];
      let error = null;
      groups.forEach((gr) => {
        let mask = 0;
        Object.keys(gr.cols).forEach((t) => {
          const m = MEALS.find((x) => x.key === t);
          const val = r[gr.cols[t]];
          const q = cellQty(val);
          const where = m.label.toLowerCase() + ' del ' + labelShort(gr.key);
          if (q.bad === 'num') { if (!error) error = 'Cantidad no válida (' + val + ') en ' + where; }
          else if (q.bad === 'text') warns.push('Texto «' + collapse(String(val)) + '» en ' + where + ': no se contó');
          else if (q.n) { mask |= m.bit; if (q.n === 2) mask |= m.bit << 3; if (q.note) xs.push(where); }
        });
        if (mask) days[gr.key] = mask;
      });
      if (xs.length && !error) error = 'Tiene una «x» en ' + xs.slice(0, 2).join(', ') + (xs.length > 2 ? ' y ' + (xs.length - 2) + ' más' : '') + ': se omite a la persona';
      if (!error && !Object.keys(days).length) error = 'No tiene ninguna comida';
      items.push({ sheet: collapse(sheet), row: i + 1, name, colArea, days, warns, error, dup: null, update: false });
    }
    const keys = groups.map((g) => g.key).sort();
    return { sheet: collapse(sheet), items, from: keys[0], to: keys[keys.length - 1] };
  }
  function parseGridWorkbook(X, wb, existing) {
    const sheets = [];
    const empty = [];
    wb.SheetNames.forEach((nm) => {
      if (/^resumen$/i.test(collapse(nm))) return;
      const ws = wb.Sheets[nm];
      if (!ws || !ws['!ref']) { empty.push(collapse(nm)); return; }
      const dec = X.utils.decode_range(ws['!ref']);
      ws['!ref'] = X.utils.encode_range({ s: { r: 0, c: 0 }, e: dec.e });
      const rows = X.utils.sheet_to_json(ws, { header: 1, defval: '', raw: true, blankrows: true });
      const g = gridSheet(rows, nm);
      if (g) sheets.push(g); else empty.push(collapse(nm));
    });
    if (!sheets.length) return null;
    const items = [];
    sheets.forEach((s) => s.items.forEach((i) => items.push(i)));
    const seen = new Map();
    items.forEach((i) => {
      if (i.error) return;
      const k = normalize(i.name);
      if (seen.has(k)) { const f = seen.get(k); i.dup = 'Repetido: ya está en «' + f.sheet + '», fila ' + f.row + ' (se omite)'; }
      else { seen.set(k, i); i.update = existing.has(k); }
    });
    return { items, sheets, empty };
  }

  /* ---------- Plantilla de requisición (Excel con fechas ya puestas, solo números 1-2 y totales bloqueados) ---------- */
  const colName = (n) => { let s = ''; while (n > 0) { const m = (n - 1) % 26; s = String.fromCharCode(65 + m) + s; n = Math.floor((n - 1) / 26); } return s; };
  const toSerial = (d) => Math.round((Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) - Date.UTC(1899, 11, 30)) / 86400000);
  function requisicionFiles(o) {
    const start = parseKey(o.from);
    const end = parseKey(o.to);
    const days = Math.round((end - start) / 86400000) + 1;
    const ROWS = 100;
    const NS = 'http://schemas.openxmlformats.org/spreadsheetml/2006/main';
    const RN = 'http://schemas.openxmlformats.org/officeDocument/2006/relationships';
    const first = 6;
    const dayCols = Array.from({ length: days }, (_, i) => first + i * 3);
    const lastDay = first + days * 3 - 1;
    const tC = lastDay + 1;
    const rN = 7 + ROWS;
    const r1 = rN + 1;
    const r2 = rN + 2;
    const L = colName;
    const str = (ref, s, t) => '<c r="' + ref + '" s="' + s + '" t="inlineStr"><is><t xml:space="preserve">' + xmlEsc(t) + '</t></is></c>';
    const blank = (ref, s) => '<c r="' + ref + '" s="' + s + '"/>';
    const num = (ref, s, v) => '<c r="' + ref + '" s="' + s + '"><v>' + v + '</v></c>';
    const fml = (ref, s, f) => '<c r="' + ref + '" s="' + s + '"><f>' + f + '</f><v>0</v></c>';
    const val = (ref, s, t) => (t ? str(ref, s, t) : blank(ref, s));
    const merges = [];
    let rows = '';
    rows += '<row r="1" ht="24" customHeight="1">' + str('B1', 1, 'REQUISICIÓN DE COMIDAS') + '</row>';
    [['Torneo', o.torneo], ['Departamento', o.dept], ['Nombre del Responsable', o.resp]].forEach((x, i) => {
      const r = 2 + i;
      rows += '<row r="' + r + '">' + str('B' + r, 2, x[0]) + val('C' + r, 3, x[1]) + blank('D' + r, 3) + blank('E' + r, 3) + '</row>';
      merges.push('C' + r + ':E' + r);
    });
    let r6 = '';
    let r7 = '';
    ['#', 'Nombre', 'Area', 'Correo', 'Telefono'].forEach((t, i) => {
      r6 += str(L(i + 1) + '6', 4, t);
      r7 += blank(L(i + 1) + '7', 4);
      merges.push(L(i + 1) + '6:' + L(i + 1) + '7');
    });
    dayCols.forEach((c, i) => {
      const sd = i % 2 ? 7 : 6;
      const ss = i % 2 ? 9 : 8;
      r6 += num(L(c) + '6', sd, toSerial(addDays(start, i))) + blank(L(c + 1) + '6', sd) + blank(L(c + 2) + '6', sd);
      r7 += str(L(c) + '7', ss, 'Comida') + str(L(c + 1) + '7', ss, 'Cena') + str(L(c + 2) + '7', ss, 'Snack');
      merges.push(L(c) + '6:' + L(c + 2) + '6');
    });
    ['Comidas', 'Cenas', 'Snacks', 'TOTAL'].forEach((t, k) => {
      r6 += str(L(tC + k) + '6', 4, t);
      r7 += blank(L(tC + k) + '7', 4);
      merges.push(L(tC + k) + '6:' + L(tC + k) + '7');
    });
    rows += '<row r="6" ht="22" customHeight="1">' + r6 + '</row><row r="7">' + r7 + '</row>';
    for (let r = 8; r <= rN; r++) {
      let x = num('A' + r, 12, r - 7) + blank('B' + r, 11) + blank('C' + r, 11) + blank('D' + r, 11) + blank('E' + r, 11);
      dayCols.forEach((c) => { x += blank(L(c) + r, 10) + blank(L(c + 1) + r, 10) + blank(L(c + 2) + r, 10); });
      [0, 1, 2].forEach((k) => { x += fml(L(tC + k) + r, 13, 'SUM(' + dayCols.map((c) => L(c + k) + r).join(',') + ')'); });
      x += fml(L(tC + 3) + r, 13, 'SUM(' + L(tC) + r + ':' + L(tC + 2) + r + ')');
      rows += '<row r="' + r + '">' + x + '</row>';
    }
    let t1 = str('A' + r1, 14, 'TOTAL POR ALIMENTO') + blank('B' + r1, 14) + blank('C' + r1, 14) + blank('D' + r1, 14) + blank('E' + r1, 14);
    for (let c = first; c <= tC + 3; c++) t1 += fml(L(c) + r1, 13, 'SUM(' + L(c) + '8:' + L(c) + rN + ')');
    rows += '<row r="' + r1 + '">' + t1 + '</row>';
    merges.push('A' + r1 + ':E' + r1);
    let t2 = str('A' + r2, 14, 'TOTAL POR DÍA') + blank('B' + r2, 14) + blank('C' + r2, 14) + blank('D' + r2, 14) + blank('E' + r2, 14);
    dayCols.forEach((c) => {
      t2 += fml(L(c) + r2, 13, 'SUM(' + L(c) + r1 + ':' + L(c + 2) + r1 + ')') + blank(L(c + 1) + r2, 13) + blank(L(c + 2) + r2, 13);
      merges.push(L(c) + r2 + ':' + L(c + 2) + r2);
    });
    t2 += fml(L(tC + 3) + r2, 13, 'SUM(' + L(tC) + r1 + ':' + L(tC + 2) + r1 + ')');
    rows += '<row r="' + r2 + '">' + t2 + '</row>';
    merges.push('A' + r2 + ':E' + r2);

    const sheetName = collapse(o.dept || '').replace(/[\[\]:*?\/\\]/g, '').slice(0, 31) || 'Departamento';
    const files = {};
    files['[Content_Types].xml'] = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/><Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/></Types>';
    files['_rels/.rels'] = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>';
    files['xl/workbook.xml'] = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="' + NS + '" xmlns:r="' + RN + '"><bookViews><workbookView/></bookViews><sheets><sheet name="' + xmlEsc(sheetName) + '" sheetId="1" r:id="rId2"/></sheets><calcPr calcId="191029" fullCalcOnLoad="1"/></workbook>';
    files['xl/_rels/workbook.xml.rels'] = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/><Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/></Relationships>';
    const al = (h2) => '<alignment horizontal="' + h2 + '" vertical="center" wrapText="1"/>';
    const xf = (nf, font, fill, border, h2, unlocked) => '<xf numFmtId="' + nf + '" fontId="' + font + '" fillId="' + fill + '" borderId="' + border + '" xfId="0" applyNumberFormat="1" applyFont="1" applyFill="1" applyBorder="1" applyAlignment="1" applyProtection="1">' + al(h2) + '<protection locked="' + (unlocked ? 0 : 1) + '"/></xf>';
    files['xl/styles.xml'] = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><styleSheet xmlns="' + NS + '"><numFmts count="1"><numFmt numFmtId="165" formatCode="ddd\\ dd/mm"/></numFmts>' +
      '<fonts count="3"><font><sz val="11"/><color rgb="FF000000"/><name val="Calibri"/></font><font><b/><sz val="16"/><color rgb="FF000000"/><name val="Calibri"/></font><font><b/><sz val="11"/><color rgb="FF000000"/><name val="Calibri"/></font></fonts>' +
      '<fills count="4"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill><fill><patternFill patternType="solid"><fgColor rgb="FFF2F2F2"/><bgColor indexed="64"/></patternFill></fill><fill><patternFill patternType="solid"><fgColor rgb="FFFDE8F1"/><bgColor indexed="64"/></patternFill></fill></fills>' +
      '<borders count="2"><border><left/><right/><top/><bottom/><diagonal/></border><border><left style="thin"><color rgb="FFBDBDC4"/></left><right style="thin"><color rgb="FFBDBDC4"/></right><top style="thin"><color rgb="FFBDBDC4"/></top><bottom style="thin"><color rgb="FFBDBDC4"/></bottom><diagonal/></border></borders>' +
      '<cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="15">' +
      xf(0, 0, 0, 0, 'left', false) + xf(0, 1, 0, 0, 'left', false) + xf(0, 2, 0, 0, 'left', false) + xf(0, 0, 0, 1, 'left', true) +
      xf(0, 2, 2, 1, 'center', false) + xf(0, 2, 3, 1, 'center', false) + xf(165, 2, 2, 1, 'center', false) + xf(165, 2, 3, 1, 'center', false) +
      xf(0, 2, 2, 1, 'center', false) + xf(0, 2, 3, 1, 'center', false) + xf(0, 0, 0, 1, 'center', true) + xf(0, 0, 0, 1, 'left', true) +
      xf(0, 0, 0, 1, 'center', false) + xf(0, 2, 2, 1, 'center', false) + xf(0, 2, 2, 1, 'left', false) +
      '</cellXfs><cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>';

      '<sheetViews><sheetView workbookViewId="0" showGridLines="0"><pane xSplit="2" ySplit="7" topLeftCell="C8" activePane="bottomRight" state="frozen"/><selection pane="bottomRight" activeCell="B8" sqref="B8"/></sheetView></sheetViews>' +

      '<dataValidations count="1"><dataValidation type="whole" operator="between" allowBlank="1" showInputMessage="1" showErrorMessage="1" errorStyle="stop" errorTitle="Dato no válido" error="Escribe solo 1 (o 2 si le tocan dos). Déjalo vacío si no le toca." promptTitle="Cantidad" prompt="Escribe 1 si le toca. Déjalo vacío si no." sqref="' + L(first) + '8:' + L(lastDay) + rN + '"><formula1>0</formula1><formula2>2</formula2></dataValidation></dataValidations>' +

  }
  async function requisicionBuffer(o) {
    const zip = new window.JSZip();
    const files = requisicionFiles(o);
    Object.keys(files).forEach((k) => zip.file(k, files[k]));
    return zip.generateAsync({ type: 'arraybuffer', compression: 'DEFLATE' });
  }

  function ImportModal({ byNorm, dl, hasExample, initialStart, onImport, onClose }) {
    const [start, setStart] = useState(initialStart || keyOf(new Date()));
    const [res, setRes] = useState(null);
    const [msg, setMsg] = useState(null);
    const [busy, setBusy] = useState(false);
    const [areaSrc, setAreaSrc] = useState('sheet');
    const [tplOpen, setTplOpen] = useState(false);
    const [tplFrom, setTplFrom] = useState(initialStart || keyOf(new Date()));
    const [tplTo, setTplTo] = useState(() => keyOf(addDays(parseKey(initialStart) || new Date(), 13)));
    const [tplDept, setTplDept] = useState('');
    const [tplTorneo, setTplTorneo] = useState('');
    const [tplResp, setTplResp] = useState('');
    const [tplErr, setTplErr] = useState(null);
    useEffect(() => {
      const h = (e) => { if (e.key === 'Escape') onClose(); };
      window.addEventListener('keydown', h);
      return () => window.removeEventListener('keydown', h);
    }, [onClose]);

    async function onFile(e) {
      const f = e.target.files && e.target.files[0];
      e.target.value = '';
      if (!f) return;
      setMsg(null);
      if (!window.XLSX) { setMsg({ err: true, text: 'No se pudo cargar el lector de Excel. Revisa tu conexión y recarga la página.' }); return; }
      setBusy(true);
      try {
        const buf = await f.arrayBuffer();
        const wb = window.XLSX.read(buf, { type: 'array' });
        const existing = hasExample ? new Map() : byNorm;
        const grid = parseGridWorkbook(window.XLSX, wb, existing);
        if (grid) {
          if (!grid.items.length) setMsg({ err: true, text: 'Encontré las fechas, pero no hay personas con nombre en «' + f.name + '».' });
          else setRes({ fileName: f.name, mode: 'grid', items: grid.items, sheets: grid.sheets, empty: grid.empty });
        } else {
          const ws = wb.Sheets[wb.SheetNames[0]];
          const rows = window.XLSX.utils.sheet_to_json(ws, { header: 1, defval: '', blankrows: true });
          const items = parseSheetRows(rows, existing);
          if (!items.length) setMsg({ err: true, text: 'No encontré filas con datos en «' + f.name + '». Usa el formato de comidas por día o la lista simple: Nombre, Área, Comidas, Cenas y Snacks.' });
          else setRes({ fileName: f.name, mode: 'counts', items });
        }
      } catch (err) {
        setMsg({ err: true, text: 'No se pudo leer el archivo. Debe ser un Excel (.xlsx, .xls) o un CSV.' });
      }
      setBusy(false);
    }
    async function plantilla() {
      try {
        await dl.save({ filename: 'Plantilla-voluntarios.xlsx', data: templateBuffer() });
        setMsg({ ok: true, text: 'Plantilla guardada. Llénala y vuelve a subirla aquí.' });
      } catch (err) {
        setMsg(err && err.code === 'declined' ? { text: 'Descarga cancelada.' } : { err: true, text: 'No se pudo guardar la plantilla.' });
      }
    }

    async function bajarPlantilla(e) {
      e.preventDefault();
      setTplErr(null);
      const a = parseKey(tplFrom);
      const b = parseKey(tplTo);
      if (!a || !b) { setTplErr({ t: 'Elige las dos fechas', d: 'El primer y el último día del torneo.' }); return; }
      if (b < a) { setTplErr({ t: 'Las fechas están al revés', d: 'El último día debe ser igual o posterior al primero.' }); return; }
      if (Math.round((b - a) / 86400000) + 1 > 62) { setTplErr({ t: 'Son demasiados días', d: 'La plantilla admite hasta 62 días.' }); return; }
      if (!window.JSZip) { setTplErr({ t: 'No se pudo cargar el generador de Excel', d: 'Revisa tu conexión y recarga la página.' }); return; }
      try {
        const data = await requisicionBuffer({ from: tplFrom, to: tplTo, dept: collapse(tplDept), torneo: collapse(tplTorneo), resp: collapse(tplResp) });
        const nm = collapse(tplDept).replace(/[^A-Za-z0-9ÁÉÍÓÚáéíóúÑñ ]/g, '').replace(/ /g, '-');
        await dl.save({ filename: 'Requisicion-' + (nm || 'comidas') + '-' + tplFrom + '.xlsx', data });
        setMsg({ ok: true, text: 'Plantilla guardada. Llénala y vuelve a subirla aquí.' });
      } catch (err) {
        if (err && err.code === 'declined') setMsg({ text: 'Descarga cancelada.' });
        else setTplErr({ t: 'No se pudo guardar la plantilla', d: 'Inténtalo de nuevo.' });
      }
    }

    const grid = !!res && res.mode === 'grid';
    const isOk = (i) => !i.error && !i.dup;
    const okItems = res ? res.items.filter(isOk) : [];
    const dups = res ? res.items.filter((i) => i.dup).length : 0;
    const bad = res ? res.items.filter((i) => i.error).length : 0;
    const upd = okItems.filter((i) => i.update).length;
    const startOk = !!parseKey(start);
    const areaOf = (i) => (grid ? (areaSrc === 'col' && i.colArea ? i.colArea : i.sheet) : i.area);
    const daysOf = (i) => (grid ? i.days : daysFromCounts(start, i.comida, i.cena, i.snack));
    const raciones = grid ? totalsOf(okItems.map((i) => ({ days: i.days }))).raciones : okItems.reduce((a, i) => a + i.comida + i.cena + i.snack, 0);
    const canGo = okItems.length > 0 && (grid || startOk);
    const go = () => {
      onImport(okItems.map((i) => ({ id: uid(), name: i.name, area: areaOf(i), days: daysOf(i) })));
      onClose();
    };
    const issues = [];
    if (grid) {
      res.items.forEach((i) => {
        const who = i.sheet + ' · fila ' + i.row + ' · ' + i.name;
        if (i.error) issues.push({ t: 'err', text: who + ': ' + i.error + ' (no se importa)' });
        else if (i.dup) issues.push({ t: 'dup', text: who + ': ' + i.dup });
        if (!i.error && !i.dup) i.warns.forEach((w) => issues.push({ t: 'warn', text: who + ': ' + w }));
      });
    }
    const warnCount = issues.filter((x) => x.t === 'warn').length;
    const msgCls = msg ? (msg.err ? 'text-danger' : msg.ok ? 'text-ok' : 'text-mute') : 'hidden';
    const issueCls = { err: 'text-danger', dup: 'text-ink', warn: 'text-mute' };

    return html`<div className="fixed inset-0 z-[60] grid place-items-center bg-black/60" style=${overlayStyle()} onClick=${onClose}>
      <div role="dialog" aria-modal="true" aria-labelledby="imp-titulo" onClick=${(e) => e.stopPropagation()}
        className="flex max-h-full w-full max-w-3xl flex-col overflow-hidden rounded-2xl border border-line bg-surface">
        <div className="flex items-start justify-between gap-4 p-5 pb-3 sm:p-6 sm:pb-3">
          <div className="min-w-0">
            <h2 id="imp-titulo" className="flex items-center gap-2 font-display text-2xl font-bold">Importar datos <${Icon} d=${P.sheet} size=${22} cls="text-accent" /></h2>
            <p className="mt-1 text-sm text-mute">Sube el Excel de requisición de comidas (una hoja por departamento, con fechas) o una lista simple.</p>
          </div>
          <button type="button" onClick=${onClose} aria-label="Cerrar" className="focus-ring grid h-9 w-9 shrink-0 place-items-center rounded-md text-mute hover:text-ink"><${Icon} d=${P.x} size=${20} /></button>
        </div>

        <div className="flex min-h-0 flex-1 flex-col gap-4 overflow-y-auto px-5 pb-4 sm:px-6">
          ${hasExample ? html`<p className="rounded-lg bg-accent-soft px-4 py-3 text-sm"><strong>Hay datos de ejemplo cargados.</strong> Al importar se reemplazan por tu lista.</p>` : null}

          ${res && res.mode === 'counts' ? html`<div className="flex flex-col gap-1.5">
            <label htmlFor="imp-inicio" className="text-sm font-semibold">Fecha de inicio de las comidas</label>
            <input id="imp-inicio" type="date" value=${start} onChange=${(e) => setStart(e.target.value)}
              className=${'focus-ring w-full max-w-xs rounded-lg border-2 bg-subtle px-4 py-2.5 text-base text-ink ' + (startOk ? 'border-line focus:border-accent' : 'border-danger')} />
            <p className="text-sm text-mute">Cada tipo de comida se reparte en días seguidos desde esa fecha. Para cargar un solo día, pon 1 en lo que le toca ese día. Si la persona ya está registrada, se le agregan esos días sin borrar los demás.</p>
          </div>` : null}

          ${!res ? html`<div className="flex flex-col gap-3 rounded-xl border-2 border-dashed border-line px-4 py-8 text-center">
              <span className="mx-auto grid h-12 w-12 place-items-center rounded-full bg-accent-soft text-accent"><${Icon} d=${P.upload} size=${24} /></span>
              <p className="font-semibold">Elige tu archivo de Excel</p>
              <p className="text-sm text-mute"><strong>Formato de requisición:</strong> una hoja por departamento, con las fechas arriba y Comida / Cena por día. Se leen todas las hojas menos «Resumen».</p>
              <p className="text-sm text-mute"><strong>Lista simple:</strong> columnas Nombre, Área, Comidas, Cenas y Snacks. Acepta .xlsx, .xls y .csv.</p>
              <div className="flex flex-col items-center justify-center gap-2 sm:flex-row">
                <input id="imp-archivo" type="file" accept=".xlsx,.xls,.csv" onChange=${onFile} className="peer sr-only" />
                <label htmlFor="imp-archivo" className="inline-flex cursor-pointer items-center justify-center gap-2 rounded-lg bg-accent px-5 py-3 text-base font-semibold text-accent-ink peer-focus-visible:outline peer-focus-visible:outline-2 peer-focus-visible:outline-offset-2 peer-focus-visible:outline-accent"><${Icon} d=${P.upload} size=${20} /> ${busy ? 'Leyendo…' : 'Elegir archivo'}</label>
                ${dl ? html`<button type="button" onClick=${() => setTplOpen((o) => !o)} aria-expanded=${tplOpen} className="focus-ring inline-flex items-center justify-center gap-2 rounded-lg border border-line px-5 py-3 text-base font-medium"><${Icon} d=${P.download} size=${20} /> Descargar plantilla</button>` : null}
              </div>
              ${dl && tplOpen ? html`<form onSubmit=${bajarPlantilla} noValidate className="mx-auto flex w-full max-w-md flex-col gap-3 rounded-xl border border-line bg-subtle p-4 text-left">
                <p className="text-sm font-semibold">Plantilla de requisición de comidas</p>
                <p className="text-xs text-mute">Se genera con las fechas ya puestas. Solo acepta 1 o 2 en cada casilla y los totales no se pueden borrar.</p>
                <div className="grid grid-cols-2 gap-3">
                  <div className="flex flex-col gap-1"><label htmlFor="pl-desde" className="text-sm font-semibold">Primer día</label><input id="pl-desde" type="date" value=${tplFrom} onChange=${(e) => { setTplFrom(e.target.value); setTplErr(null); }} className="focus-ring w-full rounded-lg border-2 border-line bg-surface px-3 py-2 text-base text-ink focus:border-accent" /></div>
                  <div className="flex flex-col gap-1"><label htmlFor="pl-hasta" className="text-sm font-semibold">Último día</label><input id="pl-hasta" type="date" value=${tplTo} onChange=${(e) => { setTplTo(e.target.value); setTplErr(null); }} className="focus-ring w-full rounded-lg border-2 border-line bg-surface px-3 py-2 text-base text-ink focus:border-accent" /></div>
                </div>
                <div className="flex flex-col gap-1"><label htmlFor="pl-dep" className="text-sm font-semibold">Departamento <span className="font-normal text-mute">(opcional)</span></label><input id="pl-dep" type="text" maxLength=${31} value=${tplDept} onChange=${(e) => setTplDept(e.target.value)} placeholder="Ej. Prensa" className="focus-ring w-full rounded-lg border-2 border-line bg-surface px-3 py-2 text-base text-ink placeholder:text-mute focus:border-accent" /></div>
                <div className="flex flex-col gap-1"><label htmlFor="pl-tor" className="text-sm font-semibold">Torneo <span className="font-normal text-mute">(opcional)</span></label><input id="pl-tor" type="text" maxLength=${60} value=${tplTorneo} onChange=${(e) => setTplTorneo(e.target.value)} placeholder="Ej. Querétaro Open 2026" className="focus-ring w-full rounded-lg border-2 border-line bg-surface px-3 py-2 text-base text-ink placeholder:text-mute focus:border-accent" /></div>
                <div className="flex flex-col gap-1"><label htmlFor="pl-res" className="text-sm font-semibold">Responsable <span className="font-normal text-mute">(opcional)</span></label><input id="pl-res" type="text" maxLength=${60} value=${tplResp} onChange=${(e) => setTplResp(e.target.value)} className="focus-ring w-full rounded-lg border-2 border-line bg-surface px-3 py-2 text-base text-ink focus:border-accent" /></div>
                ${tplErr ? html`<${Alert} title=${tplErr.t}>${tplErr.d}<//>` : null}
                <button type="submit" className="focus-ring inline-flex items-center justify-center gap-2 rounded-lg bg-accent px-5 py-3 text-base font-semibold text-accent-ink"><${Icon} d=${P.download} size=${20} /> Descargar plantilla de requisición</button>
                <button type="button" onClick=${plantilla} className="focus-ring rounded-md px-2 py-1.5 text-sm font-medium text-mute hover:text-ink">O descarga la plantilla de lista simple (Nombre, Área, Comidas, Cenas, Snacks)</button>
              </form>` : null}
            </div>`
          : html`<div className="flex flex-col gap-3">
              <p className="text-sm text-mute">Archivo: <strong className="text-ink break-all">${res.fileName}</strong> · ${grid ? 'formato de requisición (' + res.sheets.length + ' ' + plural(res.sheets.length, 'hoja', 'hojas') + ' con fechas)' : 'lista simple'}</p>
              <div className="flex flex-wrap gap-2 text-sm font-semibold tabular">
                <span className="rounded-full bg-ok-bg px-3 py-1 text-ok">${okItems.length} ${plural(okItems.length, 'persona lista', 'personas listas')} · ${raciones} ${plural(raciones, 'ración', 'raciones')}${upd ? ' (' + upd + ' ya ' + plural(upd, 'registrada', 'registradas') + ')' : ''}</span>
                ${dups > 0 ? html`<span className="rounded-full bg-subtle px-3 py-1">${dups} ${plural(dups, 'repetida se omite', 'repetidas se omiten')}</span>` : null}
                ${bad > 0 ? html`<span className="rounded-full bg-danger-bg px-3 py-1 text-danger">${bad} ${plural(bad, 'fila con problema', 'filas con problemas')}, no se importan</span>` : null}
                ${warnCount > 0 ? html`<span className="rounded-full bg-subtle px-3 py-1 text-mute">${warnCount} ${plural(warnCount, 'aviso', 'avisos')}</span>` : null}
              </div>

              ${grid ? html`<fieldset className="flex flex-col gap-2 rounded-xl border border-line p-3">
                <legend className="px-1 text-sm font-semibold">¿Qué área se le pone a cada persona?</legend>
                <label className="flex cursor-pointer items-start gap-2 text-sm"><input type="radio" name="imp-area" checked=${areaSrc === 'sheet'} onChange=${() => setAreaSrc('sheet')} className="focus-ring mt-0.5 h-4 w-4 accent-[var(--accent)]" /><span>El nombre de la hoja (Prensa, Jueces, Ball Kids…)</span></label>
                <label className="flex cursor-pointer items-start gap-2 text-sm"><input type="radio" name="imp-area" checked=${areaSrc === 'col'} onChange=${() => setAreaSrc('col')} className="focus-ring mt-0.5 h-4 w-4 accent-[var(--accent)]" /><span>La columna «Area» de cada persona (si está vacía, se usa la hoja)</span></label>
              </fieldset>

              <div className="max-h-[26vh] overflow-auto rounded-xl border border-line">
                <table className="w-full text-left text-sm">
                  <caption className="sr-only">Hojas del archivo</caption>
                  <thead className="sticky top-0 bg-subtle text-xs font-semibold uppercase tracking-wider text-mute">
                    <tr><th scope="col" className="px-3 py-2">Hoja</th><th scope="col" className="px-3 py-2">Fechas</th><th scope="col" className="px-2 py-2 text-right">Listas</th><th scope="col" className="px-2 py-2 text-right">Omitidas</th><th scope="col" className="px-2 py-2 text-right">Problemas</th></tr>
                  </thead>
                  <tbody className="tabular">
                    ${res.sheets.map((s) => {
                      const its = res.items.filter((i) => i.sheet === s.sheet);
                      return html`<tr key=${s.sheet} className="border-t border-line">
                        <td className="px-3 py-2 font-medium">${s.sheet}</td>
                        <td className="px-3 py-2 whitespace-nowrap text-mute">${s.from ? shortRange(s.from, s.to) : '—'}</td>
                        <td className="px-2 py-2 text-right">${its.filter(isOk).length}</td>
                        <td className="px-2 py-2 text-right">${its.filter((i) => i.dup).length}</td>
                        <td className=${'px-2 py-2 text-right ' + (its.some((i) => i.error) ? 'font-semibold text-danger' : '')}>${its.filter((i) => i.error).length}</td>
                      </tr>`;
                    })}
                  </tbody>
                </table>
              </div>
              ${res.empty.length ? html`<p className="text-xs text-mute">Sin formato de fechas, no se leyeron: ${res.empty.join(', ')}.</p>` : null}

              ${issues.length ? html`<div>
                <p className="mb-1.5 text-sm font-semibold">Problemas y avisos</p>
                <ul className="max-h-[28vh] overflow-auto rounded-xl border border-line p-3 text-sm">
                  ${issues.slice(0, 300).map((x, k) => html`<li key=${k} className=${'py-0.5 break-words ' + issueCls[x.t]}>${x.text}</li>`)}
                  ${issues.length > 300 ? html`<li className="py-0.5 text-mute">…y ${issues.length - 300} más.</li>` : null}
                </ul>
              </div>` : html`<p className="text-sm font-medium text-ok">No encontré problemas.</p>`}`
              : html`<div className="max-h-[45vh] overflow-auto rounded-xl border border-line">
                <table className="w-full text-left text-sm">
                  <caption className="sr-only">Vista previa de la importación</caption>
                  <thead className="sticky top-0 bg-subtle text-xs font-semibold uppercase tracking-wider text-mute">
                    <tr>
                      <th scope="col" className="px-3 py-2">Fila</th>
                      <th scope="col" className="px-3 py-2">Nombre</th>
                      <th scope="col" className="px-3 py-2">Área</th>
                      <th scope="col" className="px-2 py-2 text-right">COM</th>
                      <th scope="col" className="px-2 py-2 text-right">CEN</th>
                      <th scope="col" className="px-2 py-2 text-right">SNK</th>
                      <th scope="col" className="px-3 py-2">Estado</th>
                    </tr>
                  </thead>
                  <tbody className="tabular">
                    ${res.items.map((i) => html`<tr key=${i.row} className=${'border-t border-line ' + (i.error ? 'bg-danger-bg' : '')}>
                      <td className="px-3 py-2 text-mute">${i.row}</td>
                      <td className="px-3 py-2 font-medium">${i.name || '—'}</td>
                      <td className="px-3 py-2">${i.area || '—'}</td>
                      <td className="px-2 py-2 text-right">${i.comida}</td>
                      <td className="px-2 py-2 text-right">${i.cena}</td>
                      <td className="px-2 py-2 text-right">${i.snack}</td>
                      <td className=${'px-3 py-2 font-semibold whitespace-nowrap ' + (i.error ? 'text-danger' : 'text-ok')}>${i.error || (i.update ? 'Se agrega a una persona ya registrada' : 'Lista')}</td>
                    </tr>`)}
                  </tbody>
                </table>
              </div>`}
            </div>`}
          <p role="status" aria-live="polite" className=${'text-sm font-medium ' + msgCls}>${msg ? msg.text : ''}</p>
        </div>

        <div className="flex flex-col-reverse gap-2 border-t border-line p-4 sm:flex-row sm:justify-end sm:px-6">
          ${res ? html`<button type="button" onClick=${() => { setRes(null); setMsg(null); }} className="focus-ring inline-flex items-center justify-center gap-2 rounded-lg border border-line px-5 py-3 text-base font-medium"><${Icon} d=${P.undo} size=${18} /> Elegir otro archivo</button>` : html`<button type="button" onClick=${onClose} className="focus-ring rounded-lg border border-line px-5 py-3 text-base font-medium">Cancelar</button>`}
          ${res ? html`<button type="button" onClick=${go} disabled=${!canGo}
            className=${'focus-ring inline-flex items-center justify-center gap-2 rounded-lg px-6 py-3 text-base font-semibold ' + (canGo ? 'bg-accent text-accent-ink' : 'cursor-not-allowed bg-line text-mute')}><${Icon} d=${P.check} size=${18} sw=${3} /> Importar ${okItems.length} ${plural(okItems.length, 'persona', 'personas')}</button>` : null}
        </div>
      </div>
    </div>`;
  }

  /* Resumen de los días elegidos para una persona, con botones para abrir el menú y copiar esquemas */
  function DaysField({ days, setDays, people, onOpen, idp }) {
    const pt = personTotals(days);
    const runs = runsOf(days);
    const last = people.length ? people[people.length - 1] : null;
    const soft = 'focus-ring rounded-lg border border-line bg-surface px-3 py-2 text-sm font-semibold text-ink hover:border-mute';
    return html`<div className="flex flex-col gap-3">
      <div className="flex flex-wrap items-center gap-2">
        <button type="button" onClick=${onOpen} className="focus-ring inline-flex items-center gap-2 rounded-lg bg-accent px-4 py-2.5 text-sm font-semibold text-accent-ink"><${Icon} d=${P.calendar} size=${18} /> Elegir días y comidas</button>
        ${last ? html`<button type="button" onClick=${() => setDays(cleanDays(last.days))} title=${last.name} className=${soft}>Igual que la última persona</button>` : null}
        ${people.length > 0 ? html`<div>
          <label htmlFor=${idp + '-copiar'} className="sr-only">Copiar los días y comidas de otra persona</label>
          <select id=${idp + '-copiar'} value="" onChange=${(e) => { const p = people.find((x) => x.id === e.target.value); if (p) setDays(cleanDays(p.days)); }} className="focus-ring max-w-[14rem] rounded-lg border border-line bg-surface px-3 py-2 text-sm font-semibold text-ink">
            <option value="">Copiar de otra persona…</option>
            ${people.map((p) => html`<option key=${p.id} value=${p.id}>${p.name}</option>`)}
          </select>
        </div>` : null}
        ${pt.dias > 0 ? html`<button type="button" onClick=${() => setDays({})} className="focus-ring rounded-md px-2 py-2 text-sm font-medium text-mute hover:text-danger">Limpiar</button>` : null}
      </div>
      ${runs.length === 0
        ? html`<p className="rounded-xl border border-dashed border-line px-4 py-4 text-sm text-mute">Todavía no elegiste ningún día. Presiona «Elegir días y comidas» y marca en el calendario los días que le tocan.</p>`
        : html`<ul className="flex flex-col gap-1.5">
            ${runs.map((run) => html`<li key=${run.from} className="flex flex-wrap items-center gap-x-3 gap-y-1 rounded-lg bg-subtle px-3 py-2 text-sm">
              <span className="font-semibold">${runLabel(run.from, run.to)}</span>
              <span className="flex flex-wrap gap-1.5">${MEALS.filter((m) => run.mask & m.bit).map((m) => html`<span key=${m.key} className=${'rounded-full px-2 py-0.5 text-xs font-medium ' + MEAL_STYLE[m.key].chip}>${m.label}${qtyOf(run.mask, m) > 1 ? ' ×2' : ''}</span>`)}</span>
            </li>`)}
          </ul>`}
      ${pt.raciones > 0 ? html`<p role="status" aria-live="polite" className="text-sm font-medium">${pt.dias} ${plural(pt.dias, 'día', 'días')} con comida · ${pt.raciones} raciones: ${pt.comida} ${plural(pt.comida, 'comida', 'comidas')}, ${pt.cena} ${plural(pt.cena, 'cena', 'cenas')}, ${pt.snack} ${plural(pt.snack, 'snack', 'snacks')}.</p>` : null}
    </div>`;
  }

  function AddForm({ byNorm, areas, people, days, setDays, onOpenMenu, onAdd, onDup, onImport, defaultDays, onEditMatch }) {
    const [name, setName] = useState('');
    const [area, setArea] = useState('');
    const [err, setErr] = useState(null);
    const [okMsg, setOkMsg] = useState('');
    const inputRef = useRef(null);
    const areaRef = useRef(null);
    const timer = useRef(null);
    const match = name.trim() ? byNorm.get(normalize(name)) : null;
    const pt = personTotals(days);

    function submit(e) {
      e.preventDefault();
      const clean = collapse(name);
      if (!clean) { setErr('name'); if (inputRef.current) inputRef.current.focus(); return; }
      if (match) { onDup(match); if (inputRef.current) inputRef.current.focus(); return; }
      const cleanArea = collapse(area);
      if (!cleanArea) { setErr('area'); if (areaRef.current) areaRef.current.focus(); return; }
      if (pt.raciones === 0) { setErr('meals'); return; }
      const known = areas.find((x) => normalize(x) === normalize(cleanArea));
      const finalArea = known || cleanArea;
      onAdd({ id: uid(), name: clean, area: finalArea, days: cleanDays(days) });
      setArea(finalArea);
      setOkMsg('Agregado: ' + clean + ' · ' + finalArea + ' (' + pt.dias + ' ' + plural(pt.dias, 'día', 'días') + ', ' + pt.raciones + ' raciones)');
      clearTimeout(timer.current);
      timer.current = setTimeout(() => setOkMsg(''), 4500);
      setName('');
      setDays({ ...defaultDays });
      setErr(null);
      if (inputRef.current) inputRef.current.focus();
    }
    const setD = (d) => { setDays(d); setErr(null); };
    const nameInvalid = !!match || err === 'name';

    return html`<section><div className="mb-3 flex flex-wrap items-center justify-between gap-2"><h2 className="font-display text-lg font-semibold">Agregar persona</h2>
    <button type="button" onClick=${onImport} className="focus-ring inline-flex items-center gap-2 rounded-lg border border-line bg-surface px-3.5 py-2 text-sm font-semibold hover:border-accent hover:text-accent"><${Icon} d=${P.upload} size=${16} /> Importar datos</button></div>
    <form onSubmit=${submit} noValidate className="flex flex-col gap-5 rounded-2xl border border-line bg-surface p-5 sm:p-6">
      <p className="text-sm text-mute">Escribe el nombre y el área. Después elige los días y las comidas que le tocan.</p>

      <div className="flex flex-col gap-2">
        <label htmlFor="nombre" className="text-sm font-semibold">Nombre completo del beneficiario</label>
        <input id="nombre" ref=${inputRef} type="text" autoComplete="off" maxLength=${120} value=${name}
          placeholder="Ej. María Fernanda López Ruiz"
          onChange=${(e) => { setName(e.target.value); setErr(null); }}
          aria-invalid=${nameInvalid} aria-describedby="nombre-ayuda"
          className=${'focus-ring w-full rounded-lg border-2 bg-subtle px-4 py-3 text-lg text-ink placeholder:text-mute ' + (nameInvalid ? 'border-danger' : 'border-line focus:border-accent')} />
        <p id="nombre-ayuda" className="text-xs text-mute">No se aceptan nombres repetidos. Se ignoran mayúsculas, acentos y espacios de más.</p>
      </div>

      <div className="flex flex-col gap-2">
        <label htmlFor="area" className="text-sm font-semibold">Área</label>
        <input id="area" ref=${areaRef} type="text" list="areas-lista" autoComplete="off" maxLength=${60} value=${area}
          placeholder="Ej. Jugadores, Árbitros, Staff"
          onChange=${(e) => { setArea(e.target.value); setErr(null); }}
          aria-invalid=${err === 'area'} aria-describedby="area-ayuda"
          className=${'focus-ring w-full rounded-lg border-2 bg-subtle px-4 py-3 text-lg text-ink placeholder:text-mute ' + (err === 'area' ? 'border-danger' : 'border-line focus:border-accent')} />
        <datalist id="areas-lista">${areas.map((x) => html`<option key=${x} value=${x}></option>`)}</datalist>
        <p id="area-ayuda" className="text-xs text-mute">Elige una de la lista o escribe una nueva. Se queda seleccionada para la siguiente persona.</p>
      </div>

      <fieldset className="flex flex-col gap-3">
        <legend className="mb-1 text-sm font-semibold">Días y comidas</legend>
        <${DaysField} days=${days} setDays=${setD} people=${people} onOpen=${onOpenMenu} idp="nuevo" />
      </fieldset>

      ${match
        ? html`<${Alert} title="Este nombre ya fue registrado">Ya está en la lista como «${match.name}»${match.area ? ' (' + match.area + ')' : ''}. Si es otra persona, agrega un segundo apellido o un dato que la distinga.<//>`
        : err === 'name'
          ? html`<${Alert} title="Falta el nombre">Escribe el nombre completo de la persona.<//>`
          : err === 'area'
            ? html`<${Alert} title="Falta el área">Escribe el área a la que pertenece la persona.<//>`
            : err === 'meals'
              ? html`<${Alert} title="Elige los días y las comidas">Presiona «Elegir días y comidas» y marca en el calendario los días que le tocan a esta persona.<//>`
              : null}

      ${match ? html`<button type="button" onClick=${() => onEditMatch(match)} className="focus-ring w-fit rounded-lg border border-line px-4 py-2.5 text-sm font-semibold hover:border-accent hover:text-accent">Editar a «${match.name}» para agregarle otro día</button>` : null}

      <div className="flex flex-col gap-3 sm:flex-row sm:items-center">
        <button type="submit" className="focus-ring inline-flex w-full items-center justify-center gap-2 rounded-lg bg-accent px-6 py-3.5 text-base font-semibold text-accent-ink sm:w-auto">
          <${Icon} d=${P.plus} size=${20} sw=${2.5} /> Agregar persona
        </button>
        <p role="status" aria-live="polite" className=${'flex items-center gap-2 text-sm font-medium break-words min-w-0 ' + (okMsg ? 'text-ok' : 'hidden')}>
          ${okMsg ? html`<${Icon} d=${P.check} size=${16} sw=${3} cls="shrink-0" />` : null}<span className="min-w-0">${okMsg}</span>
        </p>
      </div>
    </form></section>`;
  }

  function DayStrip({ days }) {
    return html`<div className="flex flex-wrap gap-1" role="img" aria-label=${diasTexto(days)}>
      ${stripKeys(days).map((k) => {
        const v = days[k] || 0;
        return html`<div key=${k} title=${labelFull(k) + ': ' + (v ? mealsText(v) : 'sin comida')} className="flex w-[18px] flex-col items-center gap-[3px]">
          <span className="text-[10px] leading-none text-mute tabular">${parseKey(k).getDate()}</span>
          ${MEALS.map((m) => html`<span key=${m.key} className=${'h-1.5 w-full rounded-sm ' + ((v & m.bit) ? MEAL_STYLE[m.key].dot : 'bg-line')}></span>`)}
        </div>`;
      })}
    </div>`;
  }
  function DaysCell({ p }) {
    const pt = personTotals(p.days);
    return html`<div className="flex flex-col gap-1.5">
      <${DayStrip} days=${p.days} />
      <p className=${'text-xs ' + (pt.raciones ? 'text-mute' : 'font-semibold text-danger')}>${pt.raciones ? diasTexto(p.days) + ' · ' + pt.raciones + ' raciones' : 'Sin comidas asignadas'}</p>
    </div>`;
  }

  function Row({ p, flash, confirming, onAsk, onCancel, onDelete, onEdit, readOnly }) {
    const act = 'focus-ring inline-flex min-h-[44px] min-w-[44px] items-center justify-center gap-1.5 rounded-md px-2 text-sm font-medium text-mute ';
    return html`<tr id=${'row-' + p.id} className=${'align-top border-t border-line ' + (flash ? 'flash' : '')}>
      <td className="hidden sm:table-cell py-3 pl-4 pr-2 font-mono text-sm text-mute tabular">${p.idx}</td>
      <td className="min-w-0 py-3 pl-4 pr-3 sm:pl-2 font-medium break-words">
        ${p.name}
        ${p.area ? html`<span className="mt-0.5 block text-sm font-normal text-mute sm:hidden">${p.area}</span>` : null}
        <div className="mt-2 font-normal sm:hidden"><${DaysCell} p=${p} /></div>
      </td>
      <td className="hidden sm:table-cell py-3 pr-3 break-words">${p.area || html`<span className="text-mute">Sin área</span>`}</td>
      <td className="hidden sm:table-cell py-3 pr-3"><${DaysCell} p=${p} /></td>
      <td className=${readOnly ? 'hidden' : 'py-2 pr-3 sm:pr-4 text-right'}>
        ${confirming
          ? html`<div className="flex flex-col items-end gap-1.5 sm:flex-row sm:justify-end">
              <button type="button" onClick=${onDelete} className="focus-ring rounded-md bg-danger px-3 py-2 text-sm font-semibold text-accent-ink whitespace-nowrap">Sí, eliminar</button>
              <button type="button" onClick=${onCancel} className="focus-ring rounded-md border border-line px-3 py-2 text-sm font-medium whitespace-nowrap">Cancelar</button>
            </div>`
          : html`<div className="flex flex-col items-end sm:flex-row sm:justify-end">
              <button type="button" onClick=${onEdit} aria-label=${'Editar a ' + p.name} className=${act + 'hover:text-accent'}><${Icon} d=${P.edit} size=${18} /><span className="hidden sm:inline">Editar</span></button>
              <button type="button" onClick=${onAsk} aria-label=${'Eliminar a ' + p.name} className=${act + 'hover:text-danger'}><${Icon} d=${P.trash} size=${18} /><span className="hidden sm:inline">Eliminar</span></button>
            </div>`}
      </td>
    </tr>`;
  }

  function PeopleTable({ people, flash, example, onDelete, onClear, onExample, onEdit, scope, total, onShowAll, readOnly }) {
    const [query, setQuery] = useState('');
    const [sort, setSort] = useState('recent');
    const [confirmId, setConfirmId] = useState(null);
    const [confirmClear, setConfirmClear] = useState(false);

    const rows = useMemo(() => {
      let r = people.map((p, i) => ({ ...p, idx: i + 1 }));
      const q = normalize(query);
      if (q) r = r.filter((p) => normalize(p.name + ' ' + (p.area || '')).includes(q));
      if (sort === 'az') r.sort((a, b) => a.name.localeCompare(b.name, 'es'));
      else if (sort === 'area') r.sort((a, b) => (a.area || '').localeCompare(b.area || '', 'es') || a.name.localeCompare(b.name, 'es'));
      else r.reverse();
      return r;
    }, [people, query, sort]);

    const segBtn = (key, label) => html`<button type="button" aria-pressed=${sort === key} onClick=${() => setSort(key)}
      className=${'focus-ring px-3 py-2 text-sm font-medium ' + (sort === key ? 'bg-accent-soft text-accent' : 'bg-surface text-mute hover:text-ink')}>${label}</button>`;

    return html`<section>
      <div className="mb-3 flex flex-wrap items-baseline justify-between gap-2">
        <h2 className="font-display text-lg font-semibold">Lista registrada <span className="ml-1 text-sm font-normal text-mute">· ${scope}</span></h2>
        <p className="text-sm text-mute tabular">${people.length} ${plural(people.length, 'persona', 'personas')}</p>
      </div>
      <div className="overflow-hidden rounded-2xl border border-line bg-surface">
      <div className="flex flex-col gap-3 p-4 sm:p-6 sm:pb-4 empty:hidden">
        ${example && !readOnly ? html`<div className="rounded-lg border border-line bg-accent-soft px-4 py-3 text-sm">
          <p><strong>Estás viendo datos de ejemplo.</strong> Vacía la lista antes de capturar la real.</p>
        </div>` : null}

        ${people.length > 0 ? html`<div className="flex flex-col gap-3 sm:flex-row sm:items-center">
          ${people.length >= 6 ? html`<div className="relative flex-1 min-w-0">
            <span className="pointer-events-none absolute inset-y-0 left-3 grid place-items-center text-mute"><${Icon} d=${P.search} size=${18} /></span>
            <label htmlFor="buscar" className="sr-only">Buscar en la lista</label>
            <input id="buscar" type="search" value=${query} onChange=${(e) => setQuery(e.target.value)} placeholder="Buscar por nombre o área"
              className="focus-ring w-full rounded-lg border border-line bg-subtle py-2.5 pl-10 pr-3 text-base text-ink placeholder:text-mute" />
          </div>` : html`<div className="flex-1"></div>`}
          <div className="flex flex-wrap items-center gap-3">
            <div role="group" aria-label="Orden de la lista" className="inline-flex overflow-hidden rounded-lg border border-line">
              ${segBtn('recent', 'Recientes')}${segBtn('az', 'A–Z')}${segBtn('area', 'Por área')}
            </div>
            ${readOnly ? null : confirmClear
              ? html`<div className="flex items-center gap-2">
                  <span className="text-sm font-medium">¿Vaciar la lista de todos los días?</span>
                  <button type="button" onClick=${() => { onClear(); setConfirmClear(false); }} className="focus-ring rounded-md bg-danger px-3 py-2 text-sm font-semibold text-accent-ink">Sí, vaciar</button>
                  <button type="button" onClick=${() => setConfirmClear(false)} className="focus-ring rounded-md border border-line px-3 py-2 text-sm font-medium">Cancelar</button>
                </div>`
              : html`<button type="button" onClick=${() => setConfirmClear(true)} className="focus-ring rounded-md px-2 py-2 text-sm font-medium text-mute hover:text-danger">Vaciar lista</button>`}
          </div>
        </div>` : null}
      </div>

      ${people.length === 0 && total > 0
        ? html`<div className="mx-4 mb-4 mt-4 sm:mx-6 sm:mb-6 sm:mt-6 flex flex-col items-center gap-3 rounded-xl border-2 border-dashed border-line px-4 py-10 text-center">
            <span className="grid h-12 w-12 place-items-center rounded-full bg-accent-soft text-accent"><${Icon} d=${P.calendar} size=${24} /></span>
            <p className="font-semibold">No hay datos para ${scope.toLowerCase()}</p>
            <p className="max-w-sm text-sm text-mute">Nadie tiene comidas asignadas en este día.${readOnly ? '' : ' Agrega personas o importa un archivo para este día.'} Hay ${total} ${plural(total, 'persona registrada', 'personas registradas')} en otros días.</p>
            <button type="button" onClick=${onShowAll} className="focus-ring rounded-md border border-line px-3 py-2 text-sm font-medium hover:text-accent">Ver todos los días</button>
          </div>`
        : people.length === 0
        ? html`<div className="mx-4 mb-4 mt-4 sm:mx-6 sm:mb-6 sm:mt-6 flex flex-col items-center gap-3 rounded-xl border-2 border-dashed border-line px-4 py-10 text-center">
            <span className="grid h-12 w-12 place-items-center rounded-full bg-accent-soft text-accent"><${Icon} d=${P.receipt} size=${24} /></span>
            <p className="font-semibold">Todavía no hay personas en la lista</p>
            <p className="max-w-sm text-sm text-mute">${readOnly ? 'Todavía no se registró a nadie. Cuando haya datos, aquí verás qué días y qué comidas tiene cada persona.' : 'Agrega a la primera persona con el formulario de arriba. Aquí verás qué días y qué comidas tiene cada una, y podrás corregirlas.'}</p>
            ${readOnly ? null : html`<button type="button" onClick=${onExample} className="focus-ring rounded-md border border-line px-3 py-2 text-sm font-medium text-mute hover:text-ink">Cargar datos de ejemplo para probar</button>`}
          </div>`
        : html`<div className="overflow-x-auto">
            <table className="w-full text-left text-base">
              <caption className="sr-only">Personas registradas, sus días y sus comidas</caption>
              <thead className="bg-subtle text-xs font-semibold uppercase tracking-wider text-mute">
                <tr>
                  <th scope="col" className="hidden sm:table-cell py-2.5 pl-4 pr-2 w-12">N.º</th>
                  <th scope="col" className="py-2.5 pl-4 pr-3 sm:pl-2">Nombre</th>
                  <th scope="col" className="hidden sm:table-cell py-2.5 pr-3">Área</th>

  function EditModal({ p, people, byNorm, areas, onSave, onCancel }) {
    const [name, setName] = useState(p.name);
    const [area, setArea] = useState(p.area || '');
    const [days, setDays] = useState(() => cleanDays(p.days));
    const [menu, setMenu] = useState(false);
    const [err, setErr] = useState(null);
    useEffect(() => {
      const h = (e) => { if (e.key === 'Escape' && !menu) onCancel(); };
      window.addEventListener('keydown', h);
      return () => window.removeEventListener('keydown', h);
    }, [onCancel, menu]);
    const found = name.trim() ? byNorm.get(normalize(name)) : null;
    const dup = found && found.id !== p.id ? found : null;
    const pt = personTotals(days);
    function submit(e) {
      e.preventDefault();
      const clean = collapse(name);
      const cleanArea = collapse(area);
      if (!clean) { setErr('name'); return; }
      if (dup) return;
      if (!cleanArea) { setErr('area'); return; }
      if (pt.raciones === 0) { setErr('meals'); return; }
      const known = areas.find((x) => normalize(x) === normalize(cleanArea));
      onSave(p.id, { name: clean, area: known || cleanArea, days: cleanDays(days) });
    }
    const setD = (d) => { setDays(d); setErr(null); };
    const field = (bad) => 'focus-ring w-full rounded-lg border-2 bg-subtle px-4 py-3 text-base text-ink placeholder:text-mute ' + (bad ? 'border-danger' : 'border-line focus:border-accent');
    return html`<div className="fixed inset-0 z-50 grid place-items-center bg-black/60" style=${overlayStyle()} onClick=${onCancel}>
      <form role="dialog" aria-modal="true" aria-labelledby="edit-titulo" onClick=${(e) => e.stopPropagation()} onSubmit=${submit} noValidate
        className="flex max-h-full w-full max-w-2xl flex-col gap-4 overflow-y-auto rounded-2xl border border-line bg-surface p-5 sm:p-6">
        <h2 id="edit-titulo" className="font-display text-xl font-bold">Editar persona</h2>
        <div className="flex flex-col gap-1.5">
          <label htmlFor="ed-nombre" className="text-sm font-semibold">Nombre completo</label>
          <input id="ed-nombre" type="text" autoComplete="off" maxLength=${120} value=${name} onChange=${(e) => { setName(e.target.value); setErr(null); }} className=${field(!!dup || err === 'name')} />
        </div>
        <div className="flex flex-col gap-1.5">
          <label htmlFor="ed-area" className="text-sm font-semibold">Área</label>
          <input id="ed-area" type="text" list="areas-lista" autoComplete="off" maxLength=${60} value=${area} onChange=${(e) => { setArea(e.target.value); setErr(null); }} className=${field(err === 'area')} />
        </div>
        <fieldset className="flex flex-col gap-3">
          <legend className="mb-1 text-sm font-semibold">Días y comidas</legend>
          <${DaysField} days=${days} setDays=${setD} people=${people} onOpen=${() => setMenu(true)} idp="ed" />
        </fieldset>
        ${dup
          ? html`<${Alert} title="Este nombre ya fue registrado">Ya está en la lista como «${dup.name}».<//>`
          : err === 'name' ? html`<${Alert} title="Falta el nombre">Escribe el nombre completo de la persona.<//>`
          : err === 'area' ? html`<${Alert} title="Falta el área">Escribe el área a la que pertenece la persona.<//>`
          : err === 'meals' ? html`<${Alert} title="Elige los días y las comidas">Si esta persona ya no tiene comidas, elimínala de la lista.<//>`
          : null}
        <div className="flex flex-col-reverse gap-2 sm:flex-row sm:justify-end">
          <button type="button" onClick=${onCancel} className="focus-ring rounded-lg border border-line px-5 py-3 text-base font-medium">Cancelar</button>
          <button type="submit" className="focus-ring inline-flex items-center justify-center gap-2 rounded-lg bg-accent px-5 py-3 text-base font-semibold text-accent-ink"><${Icon} d=${P.check} size=${20} sw=${3} /> Guardar cambios</button>
        </div>
      </form>
      ${menu ? html`<${DayMenu} value=${days} onApply=${setD} onClose=${() => setMenu(false)} idp="dme" />` : null}
    </div>`;
  }
